function deep(x){return JSON.parse(JSON.stringify(x))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hash32(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash32(String(seed));return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}

function applicationProfile(m,skill,application,dependence,difficulty){
 const exp=(m.applications||{})[application]||"none";
 let eff=m.skills[skill]||0, mod=0;
 const penalties={Low:{Specialized:0,Familiar:0,Unfamiliar:.5,none:.75},Moderate:{Specialized:0,Familiar:0,Unfamiliar:1.5,none:2},High:{Specialized:0,Familiar:0,Unfamiliar:2.5,none:3.5}};
 if(exp==="Specialized" && dependence==="Moderate")eff=Math.max(eff,6);
 if(exp==="Specialized" && dependence==="High")eff=Math.max(eff,8);
 mod=penalties[dependence][exp]??penalties[dependence].none;
 return {effective:eff,difficulty:difficulty+mod,experience:exp,modifier:mod};
}
function cap(m,a){
 if(a.resolutionMode==="aptitude")return {effective:m.aptitudes[a.aptitude]||0,difficulty:a.difficulty,kind:"aptitude",label:a.aptitude,experience:"none"};
 if(a.application){const p=applicationProfile(m,a.skill,a.application,a.dependence,a.difficulty);return {...p,kind:"application",label:a.skill}}
 return {effective:m.skills[a.skill]||0,difficulty:a.difficulty,kind:"skill",label:a.skill,experience:"none"};
}
function bestFor(partyIds,a){
 return partyIds.map(id=>{const m=merc(id),p=cap(m,a);return {m,p,margin:p.effective-p.difficulty}}).sort((x,y)=>y.margin-x.margin||y.p.effective-x.p.effective||x.m.name.localeCompare(y.m.name))[0];
}
function credible(partyIds,a){return bestFor(partyIds,a).p.effective>=bestFor(partyIds,a).p.difficulty-2.25}
function riskNum(x){return x==="high"?1:x==="moderate"?.45:0}
function detNum(x){return x==="high"?.9:x==="moderate"?.4:0}
function approachScore(party,a,policy){
 const b=bestFor(party,a), w=policy==="cautious"?[.8,.7,.08]:policy==="aggressive"?[.08,.05,.38]:[.35,.3,.16];

 return `<div class="card"><h3>${esc(j.title)}</h3><div class="small muted">Recommended party ${j.recommendedParty.join("–")} · Leader required</div><div class="divider"></div>
 <div class="stack">${av.map(m=>`<label class="member"><input type="checkbox" ${selectedParty.includes(m.id)?"checked":""} onchange="toggleParty('${m.id}',this.checked)"><span><b>${esc(m.name)}</b><div class="tiny muted">${m.careerStage} · Lead ${m.skills.Leadership} · ${topSkills(m,3)}</div></span></label>`).join("")}</div>
 <div class="divider"></div><label class="small muted">Leader</label><select style="width:100%" onchange="selectedLeader=this.value;render()"><option value="">— choose —</option>${selectedParty.map(id=>`<option value="${id}" ${selectedLeader===id?"selected":""}>${merc(id).name} · Leadership ${merc(id).skills.Leadership}</option>`).join("")}</select>
 <label class="small muted" style="display:block;margin-top:8px">Risk policy</label><select style="width:100%" onchange="selectedPolicy=this.value;render()">${["cautious","balanced","aggressive"].map(x=>`<option ${selectedPolicy===x?"selected":""}>${x}</option>`).join("")}</select>
 <div class="divider"></div><div class="notice"><b>Strategist advisory</b><br><span class="small">${advice.actor?`${advice.actor.name}: `:""}${advice.text}</span></div>
 ${cov?coverageHtml(cov):""}
 <button class="btn primary" style="width:100%;margin-top:10px" ${!selectedLeader||!selectedParty.length?"disabled":""} onclick="commitSelected()">Commit expedition</button></div>`;
}
function coverageHtml(c){
 const cls=c.band==="Broad"?"good":c.band==="Narrow"?"warn":"bad";
 return `<div class="coverage notice ${cls}" style="margin-top:10px"><div class="row"><b>Approach Coverage: ${c.band}</b><span class="pill">Advisory</span></div><div class="small">${esc(c.summary)}</div>${c.rows.map(r=>`<div class="ao"><b class="small">${r.o.operation} · ${r.o.primitive}${r.o.context?` · ${r.o.context}`:""}</b><div class="tiny muted">${r.credible.length} credible of ${r.methods.length} methods</div>${r.credible.slice(0,3).map(x=>`<div class="tiny">✓ ${x.a.mechanism} — ${x.b.m.name} · ${x.b.p.kind==="aptitude"?"Aptitude "+x.b.p.label:x.a.application?`${x.a.skill} + ${x.a.application}`:x.a.skill}</div>`).join("")}</div>`).join("")}</div>`;
}
function rosterView(){
 return `<h2>Roster</h2><div class="grid grid2">${game.roster.map(m=>`<div class="card"><div class="row"><div><b>${esc(m.name)}</b><div class="small muted">${m.careerStage}</div></div><span class="pill">${esc(m.assignment?`Assigned until D${m.availableDay}`:m.readiness)}</span></div><div class="small">${topSkills(m,5)}</div><div class="pills" style="margin-top:7px">${Object.entries(m.applications||{}).map(([k,v])=>`<span class="pill">${esc(k)}: ${esc(v)}</span>`).join("")||`<span class="tiny muted">No Applications yet</span>`}</div><button class="btn" style="margin-top:8px" onclick="showMerc('${m.id}')">Details</button></div>`).join("")}</div>`;
}
function topSkills(m,n){return Object.entries(m.skills).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n).map(x=>`${x[0]} ${x[1]}`).join(" · ")}
function showMerc(id){
 const m=merc(id);document.getElementById("modalTitle").textContent=m.name;document.getElementById("modalBody").innerHTML=`<div class="row"><div><b>${m.careerStage}</b><div class="small muted">${m.readiness} · payroll ${money(m.payroll)}</div></div><div>${m.assignment?`Assigned until D${m.availableDay}`:"Available"}</div></div>
 <h4>Aptitudes</h4><div class="skillgrid">${Object.entries(m.aptitudes).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Learned Skills</h4><div class="skillgrid">${Object.entries(m.skills).map(([k,v])=>`<div>${k}<div class="bar"><span style="width:${v*10}%"></span></div></div><div>${v}</div>`).join("")}</div>
 <h4>Applications</h4><div class="pills">${Object.entries(m.applications||{}).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("")||"None"}</div>
 <h4>Recent Career History</h4>${m.careerHistory.slice(-10).reverse().map(h=>`<div class="small report-event">Day ${h.day} · ${esc(h.type)} ${h.skill?`· ${esc(h.skill)}`:""} ${h.result?`· ${esc(h.result)}`:""}</div>`).join("")||`<div class="muted small">No events yet.</div>`}`;modal.showModal()
}
function recruitView(){return `<div class="row"><div><h2 style="margin:0">Recruitment</h2><div class="small muted">Pool refreshes Day ${game.nextRecruitDay}. Hiring increases payroll immediately.</div></div></div><div class="grid grid2" style="margin-top:10px">${game.recruits.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">${c.careerStage}</div></div><div style="text-align:right"><b>${money(c.hireCost)}</b><div class="tiny muted">${money(c.payroll)}/payroll</div></div></div><div class="small">${topSkills(c,5)}</div><button class="btn" style="margin-top:8px" onclick="hire('${c.id}')">Hire</button></div>`).join("")}</div>`}
function reportsView(){return `<h2>Post-Job Reports</h2><div class="stack">${game.reports.map((r,i)=>`<div class="card ${r.outcome==="success"?"goodline":"warnline"}"><div class="row"><div><b>${esc(r.title)}</b><div class="small muted">Day ${r.day} · ${r.outcome.toUpperCase()}</div></div><b>${money(r.reward+r.bonus)}</b></div><div class="small">${r.party.join(", ")}</div><button class="btn" style="margin-top:7px" onclick="showReport(${i})">Open report</button></div>`).join("")||`<div class="card muted">No completed Jobs yet.</div>`}</div>`}
function showReport(i){
 const r=game.reports[i];document.getElementById("modalTitle").textContent=r.title;document.getElementById("modalBody").innerHTML=`<div class="row"><b>${r.outcome.toUpperCase()}</b><b>${money(r.reward+r.bonus)}</b></div><div class="small muted">Leader ${r.leader} · ${r.party.join(", ")}</div><h4>Operational events</h4>${r.events.map(e=>`<div class="report-event"><b>${e.operation} · ${e.primitive}</b>${e.context?`<div class="tiny muted">${e.context}</div>`:""}<div>${e.actorName} used <b>${e.approach}</b> — ${e.result.toUpperCase()}</div><div class="tiny muted">${e.skill?e.application?`${e.skill} + ${e.application}`:e.skill:`Aptitude ${e.aptitude}`} · margin ${e.margin}</div></div>`).join("")}<h4>Injuries</h4>${r.injuries.map(x=>`<div>${x.actorName}: ${x.severity}</div>`).join("")||`<div class="small muted">None</div>`}<h4>Development</h4>${r.devNotes.map(x=>`<div>${x}</div>`).join("")||`<div class="small muted">Evidence recorded; no Skill realization this Job.</div>`}`;modal.showModal()
}
function systemView(){return `<div class="grid grid2"><div class="card stack"><h3>Save / Load</h3><button class="btn primary" onclick="save()">Save to browser</button><button class="btn" onclick="load()">Load browser save</button><button class="btn" onclick="exportSave()">Export save JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import save JSON</button><button class="btn bad" onclick="resetGame()">New company</button></div><div class="card"><h3>Build scope</h3><div class="small muted">Offline, deterministic, no network or LLM. Playable Base v0.1 includes persistent roster, procedural multi-operation Jobs, Approach Coverage, concurrent expeditions, calendar/payroll, post-Job reports, injuries/recovery, development evidence, Applications, training, recruitment, and local saves.</div><div class="divider"></div><div class="small">Calibration is intentionally provisional. This build is for loop/fun/usability testing, not economy or balance lock.</div></div></div><h3>Ledger</h3><div class="card">${game.ledger.slice().reverse().slice(0,30).map(x=>`<div class="row small"><span>Day ${x.day} · ${esc(x.description)}</span><b class="money ${x.amount>=0?"pos":"neg"}">${money(x.amount)}</b></div>`).join("")}</div>`}

document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importSave(e.target.files[0])});
bootstrap();
render();
</script>
</body>
</html>

// Payroll & Retention v0.1 — invoices are liabilities, never negative cash.
function payrollAccount(m,day=game.day){if(!m.payrollAccount)m.payrollAccount={invoices:[],paymentHistory:[],lateCycles:0,brokenPromises:0,promise:null,grievance:"Satisfied",grievanceSince:day};return m.payrollAccount}
function wageDue(m){return payrollAccount(m).invoices.reduce((a,b)=>a+Math.max(0,(b.amount||0)-(b.paid||0)),0)}
function totalWageArrears(){return [...(game.roster||[]),...(game.alumni||[])].reduce((s,m)=>s+wageDue(m),0)}
function oldestUnpaidDay(m){const i=payrollAccount(m).invoices.find(x=>x.paid+0.001<x.amount);return i?i.day:null}
function payrollAge(m){const d=oldestUnpaidDay(m);return d==null?0:Math.max(0,game.day-d)}
function paymentGrievance(m){const a=payrollAccount(m),due=wageDue(m);if(due<.001)return a.trustRecoveryUntilDay>game.day?"Rebuilding Trust":"Satisfied";const age=Math.max(0,payrollAge(m)-(a.promise&&game.day<=a.promise.deadlineDay?4:0)),fraction=due/Math.max(1,m.payroll||1),repeated=Math.min(10,a.lateCycles*3+a.brokenPromises*5);if(age+repeated>=55&&fraction>=.5)return "Departure";if(age+repeated>=35&&fraction>=.35)return "Ultimatum";if(age+repeated>=20&&fraction>=.25)return "Disgruntled";return "Concerned"}
function recordPayrollInvoice(payday){game.payrollHistory=game.payrollHistory||[];const hadArrears=totalWageArrears()>0;let charged=0;for(const m of game.roster){const a=payrollAccount(m);if(wageDue(m)>0)a.lateCycles++;const amount=Math.max(0,Number(m.payroll)||0);if(!amount)continue;a.invoices.push({id:`W-${payday}-${m.id}`,day:payday,amount,paid:0});charged+=amount;}game.payrollHistory.push({day:payday,charged,paidAtCreation:0,rosterSize:game.roster.length});if(!hadArrears&&game.cash>=charged){for(const m of [...game.roster])if(wageDue(m)>0)settleWages(m.id,wageDue(m));game.payrollHistory[game.payrollHistory.length-1].paidAtCreation=charged;notify(`Payroll paid in full: ${money(charged)}.`,"good");logDiag("payroll_auto_paid",{day:payday,amount:charged});return}logDiag("payroll_invoiced",{day:payday,charged,arrears:totalWageArrears()});notify(`Day ${payday} payroll due: ${money(charged)}. Allocate payments in Company → Payroll.`,"warn");}
function settleWages(id,amount){const m=[...game.roster,...game.alumni].find(x=>x.id===id);if(!m)return false;amount=Math.round(Number(amount));if(!Number.isFinite(amount)||amount<=0||amount>wageDue(m)+.001||amount>game.cash+0.001){notify("Invalid payment: check cash and outstanding wages.","bad");return false}const a=payrollAccount(m),previous=wageDue(m),previousStatus=paymentGrievance(m),worstStatus=a.worstArrearsStatus||a.grievance;let remaining=amount;for(const inv of a.invoices){const n=Math.min(remaining,inv.amount-inv.paid);inv.paid+=n;if(inv.paid>=inv.amount&&inv.firstFullyPaidDay==null)inv.firstFullyPaidDay=game.day;remaining-=n;if(remaining<=0)break;}addLedger(-amount,"payroll_payment",`Wages paid to ${m.name}`);a.paymentHistory.push({day:game.day,campaignHour:game.campaignHour,amount});game.payrollPayments=game.payrollPayments||[];game.payrollPayments.push({day:game.day,actorId:m.id,amount});if(wageDue(m)<.001){if(["Disgruntled","Ultimatum","Departure"].includes(previousStatus)||["Disgruntled","Ultimatum","Departure"].includes(worstStatus))a.trustRecoveryUntilDay=Math.max(a.trustRecoveryUntilDay||0,game.day+(["Ultimatum","Departure"].includes(previousStatus)||["Ultimatum","Departure"].includes(worstStatus)?30:14));a.worstArrearsStatus=null;if(a.promise)a.promise=null;}updatePaymentGrievances();logDiag("wages_settled",{actorId:id,amount,previous,remaining:wageDue(m)});return true}
function payPayrollAllocation(){if(!companyCanAct())return;const inputs=[...document.querySelectorAll('[data-payroll-id]')],alloc=inputs.map(el=>({id:el.dataset.payrollId,amount:Number(el.value)}));const ids=new Set(),valid=alloc.every(p=>{if(ids.has(p.id))return false;ids.add(p.id);const m=[...game.roster,...game.alumni].find(x=>x.id===p.id);return m&&Number.isInteger(p.amount)&&p.amount>=0&&p.amount<=wageDue(m)}),total=alloc.reduce((s,p)=>s+p.amount,0);if(!valid||total>game.cash){notify("Payment allocation exceeds cash or an individual's outstanding wages.","bad");render();return}if(!total){notify("Enter at least one payment amount.","warn");return}for(const p of alloc)if(p.amount)settleWages(p.id,p.amount);notify(`Paid ${money(total)} toward wages. Remaining arrears: ${money(totalWageArrears())}.`,"good");saveSilently();render()}
function makePayPromise(id){if(!companyCanAct())return;const m=game.roster.find(x=>x.id===id);if(!m||!wageDue(m))return;const a=payrollAccount(m);if(a.promise){notify("An existing payment promise is already active.","warn");return}const deadline=game.day+7;const episode=payrollAccount(m).invoices.find(x=>x.amount>x.paid)?.id;if(a.promiseEpisodeId===episode){notify("A repayment promise has already been made for this overdue obligation.","warn");return}a.promiseEpisodeId=episode;a.promise={madeDay:game.day,deadlineDay:deadline,amount:wageDue(m)};a.paymentHistory.push({day:game.day,type:"promise",amount:wageDue(m),deadlineDay:deadline});notify(`Promised ${m.name} repayment by Day ${deadline}. Breaking this promise will damage trust.`,"warn");logDiag("payment_promise",{actorId:id,deadline,amount:a.promise.amount});saveSilently();render()}

function recruitmentAdvance(c){const r=payrollReliability(),persistent=game.payrollHistory.length>=2||game.roster.some(m=>payrollAge(m)>=14||payrollAccount(m).brokenPromises>0||payrollAccount(m).invoices.some(i=>i.firstFullyPaidDay!=null&&i.firstFullyPaidDay>i.day+7));return r.total>=3&&persistent&&(r.label==="Poor"||r.label==="Inconsistent")?Math.ceil(c.hireCost*0.2):0}
function payrollReliability(){const h=game.payrollHistory||[];if(!h.length)return {label:"Unproven",ontime:0,total:0,late:0};let total=0,ontime=0;for(const m of [...game.roster,...game.alumni])for(const inv of payrollAccount(m).invoices){total++;if(inv.paid>=inv.amount&&inv.firstFullyPaidDay!=null&&inv.firstFullyPaidDay<=inv.day)ontime++}return {label:total?ontime===total?"Reliable":ontime/total>=.75?"Mostly reliable":ontime/total>=.5?"Inconsistent":"Poor":"Unproven",ontime,total,late:total-ontime}}
function leaveOverPayroll(m){if(!game.roster.includes(m)||game.roster.length<=1)return false;if(m.assignment||!availableExceptPayroll(m))return false;const a=payrollAccount(m),old=deep(m);old.departedDay=game.day;old.departedHour=game.campaignHour;old.departureReason="unpaid_wages";game.alumni.push(old);game.roster=game.roster.filter(x=>x.id!==m.id);selectedParty=selectedParty.filter(id=>id!==m.id);if(selectedLeader===m.id)selectedLeader="";for(const k of Object.keys(selectedRoles))if(selectedRoles[k]===m.id)selectedRoles[k]="";notify(`${m.name} left the company over unpaid wages. Outstanding wages remain owed.`,"bad");logDiag("unpaid_departure",{actorId:m.id,arrears:wageDue(m)});return true}

function updatePaymentGrievances(){for(const m of [...game.roster,...game.alumni]){const a=payrollAccount(m);if(a.promise&&game.day>a.promise.deadlineDay&&wageDue(m)>0){a.brokenPromises++;a.paymentHistory.push({day:game.day,type:"broken_promise",amount:wageDue(m)});a.promise=null;notify(`${m.name}: a wage repayment promise was broken.`,"bad")}const next=paymentGrievance(m);if(["Disgruntled","Ultimatum","Departure"].includes(next)&&({Disgruntled:1,Ultimatum:2,Departure:3}[next]||0)>({Disgruntled:1,Ultimatum:2,Departure:3}[a.worstArrearsStatus]||0))a.worstArrearsStatus=next;if(next!==a.grievance){a.grievance=next;a.grievanceSince=game.day;if(game.roster.includes(m))notify(`${m.name}: payment status is now ${next}.`,next==="Concerned"?"warn":"bad");logDiag("payroll_grievance_changed",{actorId:m.id,status:next,arrears:wageDue(m),age:payrollAge(m)})}if(next==="Departure"&&game.roster.includes(m))leaveOverPayroll(m)}}

 if(skills.has("Logistics")||applicationRows.some(x=>["Vehicle Handling","Animal Handling"].includes(x.application))||allApproaches.some(a=>(a.resource||0)>=15))roles.push({role:"Quartermaster",level:"Useful",reason:"Known approaches include logistics, transport, or material demands."});

p(v=>`<option value="${v}" ${rosterCompare.careerStage===v?"selected":""}>${v}</option>`).join("")}</select></label><label class="small muted">Skill threshold<select onchange="setRosterCompareFilter('skill',this.value)"><option value="all">Any Skill</option>${skillNames.map(v=>`<option value="${esc(v)}" ${rosterCompare.skill===v?"selected":""}>${esc(v)}</option>`).join("")}</select><input type="number" min="0" max="10" value="${Number(rosterCompare.skillMin||0)}" aria-label="Minimum skill" ${rosterCompare.skill==="all"?"disabled":""} onchange="setRosterCompareFilter('skillMin',this.value)"></label><label class="small muted">Role suitability<select onchange="setRosterCompareFilter('role',this.value)"><option value="all">Any role</option>${roleNames.map(([v,l])=>`<option value="${v}" ${rosterCompare.role===v?"selected":""}>${l}</option>`).join("")}</select></label><label class="small muted">Minimum fit<select ${rosterCompare.role==="all"?"disabled":""} onchange="setRosterCompareFilter('roleMin',this.value)">${["Poor","Adequate","Strong"].map(v=>`<option value="${v}" ${rosterCompare.roleMin===v?"selected":""}>${v}</option>`).join("")}</select></label></div><div class="divider"></div><details><summary class="small"><b>Choose comparison columns</b> <span class="column-count ${rosterCompare.columns.length>=3&&rosterCompare.columns.length<=5?"good":"bad"}">${rosterCompare.columns.length}/5</span></summary><div class="roster-column-picker" style="margin-top:8px">${ROSTER_COMPARE_COLUMNS.map(c=>`<label><input type="checkbox" ${rosterCompare.columns.includes(c.key)?"checked":""} onchange="toggleRosterCompareColumn('${esc(c.key)}',this.checked)">${esc(c.label)}</label>`).join("")}</div></details></div>${rosterComparisonTable()}`}

 <h4>Aptitudes</h4><div class="skillgrid">${Object.entries(m.aptitudes).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Learned Skills</h4><div>${Object.entries(m.skills).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,v])=>{const dp=developmentProgressSnapshot(m,k),right=v>=10?"Mastered":`${dp.progress.toFixed(1)} / ${dp.threshold.toFixed(1)}`;return `<div class="dev-row"><div class="row"><div><b>${esc(k)}</b> <span class="tiny muted">${esc(dp.label)}</span></div><div><b>${v}</b> <span class="dev-meta">${right}</span></div></div><div class="dev-meter"><span style="width:${dp.pct.toFixed(1)}%"></span></div></div>`}).join("")}</div>

 <div class="divider"></div><button class="btn bad" style="width:100%" ${availableExceptPayroll(m)&&game.roster.length>1?"":"disabled"} onclick="confirmFire('${m.id}')">Fire Mercenary</button>${!availableExceptPayroll(m)?`<div class="tiny muted" style="margin-top:5px">Mercenaries can only be dismissed while physically available to the company.</div>`:""}`;modal.showModal()

function recruitView(){const until=game.nextRecruitDay-game.day;return `<div class="row"><div><h2 style="margin:0">Recruitment</h2><div class="small muted">Next market arrival approximately Day ${game.nextRecruitDay} (${Math.max(0,until)} days). Hiring does not trigger replacement. A record of poor payment reliability may increase recruitment advances.</div></div></div><div class="grid grid2" style="margin-top:10px">${game.recruits.map(c=>{ensureDevelopmentProfile(c);return `<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">Age ${c.age} · ${c.careerStage} · leaves after Day ${c.expiresDay}</div></div><div style="text-align:right"><b>${money(c.hireCost+recruitmentAdvance(c))}</b><div class="tiny muted">${money(c.payroll)}/payroll${recruitmentAdvance(c)?` · ${money(recruitmentAdvance(c))} reliability advance`:""}</div></div></div><div class="small" style="margin-top:5px">${topSkills(c,4)}</div><div class="tiny" style="margin-top:6px"><b>Best current fit:</b> ${recruitBestFits(c).map(esc).join(" / ")}</div><div class="tiny" style="margin-top:5px"><b>Temperament:</b> ${esc(personalityHook(c))}</div><div class="tiny" style="margin-top:6px"><b>Outlook:</b> ${esc(prospectOutlook(c))} <span class="muted">· ${assessmentConfidenceLabel(c)} confidence</span></div>${recruitAssessmentDetails(c)}<div class="row wrap" style="margin-top:8px"><button class="btn" onclick="hire('${c.id}')">Hire</button><button class="btn" onclick="rerollRecruitName('${c.id}')">↻ Reroll name</button></div></div>`}).join("")||`<div class="card muted">No candidates are currently available. The market will refill on its own schedule.</div>`}</div>`}

function fmt3(n){return Number(n??0).toFixed(2)}
function capabilityLabel(a){return a.aptitude?`Aptitude ${a.aptitude}`:a.application?`${a.skill} + ${a.application}${a.applicationExperience&&a.applicationExperience!=="none"?` (${a.applicationExperience})`:""}`:(a.skill||"Unknown")}
function selectionMathHtml(a){
 const m=a.selectionMath||{};
 const fallback=a.fallbackPenalty?` − ${fmt3(a.fallbackPenalty)} fallback`:"";
 return `<div class="tiny muted">Selection score: ${fmt3(m.capabilityMargin)} capability margin − ${fmt3(m.riskPenalty)} risk − ${fmt3(m.detectionPenalty)} detection − ${fmt3(m.timePenalty)} time − ${fmt3(m.resourcePenalty)} resources${fallback} = <b>${fmt3(a.selectionScore)}</b></div>`;
}
function availableApproachesHtml(e){

 if(!rows.length)return `<div class="tiny muted">Approach audit was not recorded in this older report.</div>`;
 return `<details style="margin-top:8px"><summary class="small"><b>Available approaches (${rows.length})</b></summary><div style="margin-top:6px">${rows.map(a=>`<div class="card" style="padding:8px;margin:6px 0;background:#121519"><div class="row"><div><b>${a.chosen?"✓ ":""}${esc(a.mechanism)}</b>${a.chosen?` <span class="pill">CHOSEN</span>`:""}</div><span class="pill">${a.credible?"Credible":"Fallback"}</span></div><div class="tiny">Best actor: <b>${esc(a.bestActorName)}</b> · ${esc(capabilityLabel(a))}</div><div class="tiny muted">Capability ${fmt3(a.effective)} · base difficulty ${fmt3(a.baseDifficulty)}${a.applicationModifier?` + app modifier ${fmt3(a.applicationModifier)}`:""} = adjusted difficulty ${fmt3(a.adjustedDifficulty)}</div><div class="tiny muted">Risk ${a.casualty} · detection ${a.detection} · ${fmt3(a.timeHours)}h · ${money(a.resource)}</div>${selectionMathHtml(a)}${!a.considered?`<div class="tiny muted">Not considered for selection because at least one credible method existed.</div>`:""}</div>`).join("")}</div></details>`;

function resultMathHtml(e){
 const m=e.resultMath||{effective:e.effective,varianceRoll:e.varianceRoll,adjustedDifficulty:e.difficulty,margin:e.margin};
 if(m.varianceRoll===undefined||m.varianceRoll===null)return `<div class="tiny muted">Legacy report: deterministic variance roll was not recorded.</div>`;
 return `<div class="notice" style="margin-top:7px"><b class="small">Resolution math</b><div class="small"><b>${fmt3(m.effective)}</b> effective capability + <b>${Number(m.varianceRoll)>=0?"+":""}${fmt3(m.varianceRoll)}</b> variance − <b>${fmt3(m.adjustedDifficulty)}</b> adjusted difficulty = <b>${Number(m.margin)>=0?"+":""}${fmt3(m.margin)}</b> margin → ${e.result.toUpperCase()}</div><div class="tiny muted">Strong ≥ +2 · Solid ≥ 0 · Mixed ≥ −2 · Poor &lt; −2</div></div>`;
}
function reportStandoutsHtml(r){const rows=new Map();for(const e of r.events||[]){const id=e.actorId||e.actorName,name=e.actorName||"Unknown";if(!rows.has(id))rows.set(id,{name,actions:0,strong:0,solid:0,mixed:0,poor:0,skills:new Set()});const x=rows.get(id);x.actions++;x[e.result]=(x[e.result]||0)+1;if(e.skill)x.skills.add(e.skill)}if(r.leaderId||r.leader){const id=r.leaderId||`leader:${r.leader}`;if(!rows.has(id))rows.set(id,{name:r.leader,actions:0,strong:0,solid:0,mixed:0,poor:0,skills:new Set()});rows.get(id).leader=true}for(const x of r.stretchMoments||[]){const id=x.actorId||x.actorName;if(!rows.has(id))rows.set(id,{name:x.actorName,actions:0,strong:0,solid:0,mixed:0,poor:0,skills:new Set()});rows.get(id).stretch=(rows.get(id).stretch||0)+1}const ranked=[...rows.values()].map(x=>({...x,score:x.strong*4+x.solid*2+x.actions+(x.leader?2:0)+(x.stretch||0)*2})).sort((a,b)=>b.score-a.score||b.strong-a.strong||a.name.localeCompare(b.name)).slice(0,3);if(!ranked.length)return `<div class="small muted">No individual contribution record available.</div>`;return `<div class="report-summary-grid">${ranked.map(x=>{const bits=[];if(x.leader)bits.push("Leader");if(x.strong)bits.push(`${x.strong} Strong`);if(x.solid)bits.push(`${x.solid} Solid`);if(x.stretch)bits.push(`${x.stretch} Stretch`);if(!bits.length&&x.actions)bits.push(`${x.actions} Primary Action${x.actions===1?"":"s"}`);const skills=[...x.skills].slice(0,2);if(skills.length)bits.push(skills.join(" / "));return `<div class="report-highlight"><strong>${esc(x.name)}</strong><div class="small">${esc(bits.join(" · ")||"Participated in the expedition")}</div></div>`}).join("")}</div>`}
function reportImportantEventsHtml(r){const events=r.events||[];if(!events.length)return `<div class="small muted">No objective events recorded.</div>`;return `<div class="stack">${events.map((e,idx)=>`<div class="report-highlight"><div class="row"><strong>${idx+1}. ${esc(e.operation)} · ${esc(e.primitive)}</strong><span class="pill">${esc(String(e.result||"").toUpperCase())}</span></div><div class="small">${esc(e.actorName||"Unknown")} · ${e.skill?esc(e.application?`${e.skill} / ${e.application}`:e.skill):`Aptitude ${esc(e.aptitude||"—")}`}</div>${e.narrative?.result?`<div class="tiny muted" style="margin-top:3px">${esc(e.narrative.result)} ${esc(e.narrative.consequence||"")}</div>`:""}${e.commandRecovery?`<div class="tiny ${e.commandRecovery.success?"good":"muted"}" style="margin-top:3px">Command: ${esc(e.commandRecovery.label)} · ${esc(e.commandRecovery.leaderName)} (Leadership ${e.commandRecovery.leadership})</div>`:""}</div>`).join("")}</div>`}
function commandRecoveryHtml(cr){if(!cr)return "";const cls=cr.success?"good":"warn",effect=cr.kind==="controlled_fallback"?"Poor objective contained through a controlled fallback; the original Poor grade remains.":cr.kind==="contain_detection"?"Prevented this setback from escalating detection/alarm pressure.":cr.kind==="contain_casualties"?"Reduced the secondary casualty exposure created by the setback.":cr.kind==="contain_delay"?`Recovered ${cr.timeSaved||0}h of delay.`:cr.kind==="preserve_cohesion"?"Preserved expedition cohesion after the setback.":"The intervention did not contain the setback.";return `<div class="notice ${cls}" style="margin-top:6px"><b>Command ${cr.success?"Recovery":"Intervention"} — ${esc(cr.leaderName)} (Leadership ${cr.leadership})</b><div class="small" style="margin-top:4px">${esc(cr.narrative||"")}</div><div class="small"><b>${esc(cr.label)}</b> · ${esc(effect)}</div><div class="tiny muted">Leadership ${cr.leadership} + ${Number(cr.varianceRoll)>=0?"+":""}${fmt3(cr.varianceRoll)} variance − ${fmt3(cr.difficulty)} recovery difficulty = ${Number(cr.margin)>=0?"+":""}${fmt3(cr.margin)} · Command Strain ${cr.strainBefore} → ${cr.strainAfter}</div></div>`}
function reportScoutSummaryHtml(r){const xs=r.scoutInterventions||[];if(!xs.length)return `<div class="small muted">No reconnaissance intervention was required.</div>`;const attempted=xs.filter(x=>x.attempted),success=attempted.filter(x=>x.success),strong=attempted.filter(x=>x.strong);if(!attempted.length)return `<div class="notice"><b>Scout unassigned</b><div class="small">${xs.length} reconnaissance incident${xs.length===1?"":"s"} resolved without specialist intervention.</div></div>`;return `<div class="notice"><b>Scout performance — ${esc(attempted[0].scoutName||"Assigned Scout")}</b><div class="small" style="margin-top:4px">${attempted.length} intervention${attempted.length===1?"":"s"} · ${success.length} contained · ${strong.length} intelligence edge${strong.length===1?"":"s"} · final Recon Load ${r.reconLoad||0}</div>${attempted.map(x=>`<div class="tiny muted" style="margin-top:3px">${esc(x.narrative||"")} ${esc(x.skill||"")} ${x.skillValue??""} + ${Number(x.varianceRoll)>=0?"+":""}${fmt3(x.varianceRoll)} variance − ${fmt3(x.difficulty)} difficulty = ${Number(x.margin)>=0?"+":""}${fmt3(x.margin)}</div>`).join("")}</div>`}
function reportQuartermasterSummaryHtml(r){const xs=r.quartermasterTravel||[];if(!xs.length)return `<div class="small muted">No travel or camp logistics incident was recorded.</div>`;const attempted=xs.filter(x=>x.attempted),contained=attempted.filter(x=>x.success),saved=contained.reduce((n,x)=>n+Number(x.timeSaved||0),0);if(!attempted.length)return `<div class="notice"><b>Quartermaster unassigned</b><div class="small">${xs.length} travel/camp logistical incident(s) added ${xs.reduce((n,x)=>n+Number(x.delayHours||0),0)}h without specialist containment.</div></div>`;return `<div class="notice"><b>Quartermaster — ${esc(attempted[0].quartermasterName||"Assigned Quartermaster")}</b><div class="small">${attempted.length} logistical incident(s) · ${contained.length} contained · ${saved}h saved</div>${xs.map(x=>`<div class="tiny muted">${esc(x.narrative||x.label)}${x.attempted?` · Logistics ${x.logistics}, margin ${fmt3(x.margin)}, load ${x.loadBefore}`:""}</div>`).join("")}</div>`}
function reportMedicSummaryHtml(r){const xs=(r.injuries||[]).map(i=>i.fieldTreatment).filter(Boolean),attempted=xs.filter(x=>x.attempted),success=attempted.filter(x=>x.success),prevented=attempted.filter(x=>x.complicationPrevented),saved=attempted.reduce((n,x)=>n+Number(x.recoveryDaysSaved||0),0);if(!xs.length)return `<div class="small muted">No casualty required field treatment.</div>`;if(!attempted.length)return `<div class="notice"><b>Medic unassigned</b><div class="small">${xs.length} injur${xs.length===1?"y":"ies"} resolved without a field-stabilization intervention.</div></div>`;return `<div class="notice"><b>Medic performance — ${esc(attempted[0].medicName||"Assigned Medic")}</b><div class="small" style="margin-top:4px">${attempted.length} treatment${attempted.length===1?"":"s"} · ${success.length} stabilization${success.length===1?"":"s"} · ${prevented.length} complication${prevented.length===1?"":"s"} prevented · ${saved} recovery day${saved===1?"":"s"} saved · final Medical Load ${r.medicalLoad||attempted.length}</div></div>`}
function reportCommandSummaryHtml(r){const xs=(r.events||[]).filter(e=>e.commandRecovery),contained=xs.filter(e=>e.commandRecovery.success).length,fallbacks=xs.filter(e=>e.commandRecovery.kind==="controlled_fallback").length,w=r.withdrawalHandling;if(!xs.length&&!w)return `<div class="small muted">No command recovery was required.</div>`;return `<div class="notice"><b>Command performance</b><div class="small" style="margin-top:4px">${xs.length} intervention${xs.length===1?"":"s"} · ${contained} setback${contained===1?"":"s"} contained · ${fallbacks} controlled fallback${fallbacks===1?"":"s"} · final Command Strain ${r.commandStrain||0}</div>${w?`<div class="small">Withdrawal: <b>${esc(w.label)}</b> — ${w.orderly?"the leader kept the retreat organized.":"the expedition withdrew under continuing command pressure."}</div>`:""}</div>`}
function reportObjectiveDetailHtml(e,idx){return `<div class="report-event"><div class="row"><b>${idx+1}. ${esc(e.operation)} · ${esc(e.primitive)}</b><span class="pill">${esc(String(e.result||"").toUpperCase())}</span></div>${eventNarrativeHtml(e)}${commandRecoveryHtml(e.commandRecovery)}<div class="tiny muted">${e.skill?e.application?`${esc(e.skill)} + ${esc(e.application)}`:esc(e.skill):`Aptitude ${esc(e.aptitude||"—")}`} · casualty ${esc(e.casualty||"unknown")} · detection ${esc(e.detection||"unknown")}${e.evidenceKind?` · ${esc(e.evidenceKind)}`:""}</div><details class="report-math-detail"><summary>Resolution math</summary>${resultMathHtml(e)}</details>${availableApproachesHtml(e)}</div>`}
// Skill increases are career milestones. Existing Job reports recorded the exact before/after ratings in devNotes.
function jobSkillIncreaseMoments(r){
 const moments=[];
 for(const note of r.devNotes||[]){
  const match=String(note).match(/^(.+?): (.+?) improved (\d+) → (\d+)(.*)$/);
  if(!match)continue;
  const actorName=match[1],skill=match[2],beforeSkill=Number(match[3]),afterSkill=Number(match[4]);
  const actorId=(r.partyIds||[]).find((id,i)=>(r.party||[])[i]===actorName)||null;
  moments.push({actorId,actorName,skill,beforeSkill,afterSkill,context:match[5]?.includes("during ")?match[5].split("during ")[1].split(";")[0]:null});
 }
 return moments;
}

report-highlight"><strong>Medic — ${esc(role("medic"))}</strong><div class="small">No casualty/treatment simulation is currently performed for Strategic Commitments.</div></div></div>`}${details}<h4>Career moments</h4>${skillIncreaseMomentsHtml((r.development||[]).filter(d=>d.improved).map(d=>({actorName:d.actorName,skill:d.skill,beforeSkill:d.beforeSkill,afterSkill:d.afterSkill,context:d.source})).filter(d=>d.beforeSkill!==null&&d.afterSkill!==null))}${(r.development||[]).some(d=>d.improved&&(d.beforeSkill==null||d.afterSkill==null))?`<div class="notice goodline"><b>Skill increase recorded</b><div class="small">${(r.development||[]).filter(d=>d.improved&&(d.beforeSkill==null||d.afterSkill==null)).map(d=>`${esc(d.actorName)} · ${esc(d.skill)}`).join("<br>")}</div></div>`:""}${!(r.development||[]).some(d=>d.improved)?`<div class="small muted">No Skill increases recorded during this commitment.</div>`:""}<h4>Career development</h4>${r.development?.length?r.development.map(d=>`<div class="report-event small"><b>${esc(d.actorName)}</b> · ${esc(d.skill)} · ${esc(d.source)} · ${esc(d.result)} · ${num(d.progress)} progress${d.improved?" · Skill improved":""}</div>`).join(""):`<div class="small muted">No recorded development${withdrawal?" (commitment ended early)":""}.</div>`}`;

function relationStandingLabel(v){return String(v||"unknown").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}
function relationOutcomeLabel(v){return String(v||"unknown").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}

const RELATIONSHIP_DERIVATION_VERSION="0.2";
function inferStrategicAttributionFromWorldEvent(ev){const ws=game?.worldState;if(!ws||!ev)return null;if(ev.strategicBeneficiaryFactionId&&ev.strategicOpponentFactionId)return {beneficiaryFactionId:ev.strategicBeneficiaryFactionId,opponentFactionId:ev.strategicOpponentFactionId,side:ev.strategicSide||null,inferred:false};const sit=ws.situations?.[ev.situationId],conflict=sit?.strategicConflictId?ws.strategicConflicts?.[sit.strategicConflictId]:null;if(!conflict)return null;let side=null;const fact=ev.strategicFactId?ws.strategicFacts?.[ev.strategicFactId]:null;if(fact?.side)side=fact.side;if(!side){const empFaction=ws.employers?.[ev.employerId]?.factionId||null;if(empFaction===conflict.attackerFactionId)side="attacker";else if(empFaction===conflict.defenderFactionId)side="defender"}if(!side)return null;const beneficiaryFactionId=side==="attacker"?conflict.attackerFactionId:conflict.defenderFactionId,opponentFactionId=side==="attacker"?conflict.defenderFactionId:conflict.attackerFactionId;return {beneficiaryFactionId,opponentFactionId,side,inferred:true}}
function rebuildStrategicRelationshipEvidence(){const ws=game?.worldState;if(!ws)return;const byEvent=new Map((ws.history||[]).map(ev=>[ev.id,ev]));for(const ev of ws.history||[]){if(ev.eventType!=="contract_world_consequence")continue;const a=inferStrategicAttributionFromWorldEvent(ev);if(a?.beneficiaryFactionId&&a?.opponentFactionId&&!ev.strategicBeneficiaryFactionId){ev.strategicBeneficiaryFactionId=a.beneficiaryFactionId;ev.strategicOpponentFactionId=a.opponentFactionId;ev.strategicSide=a.side;ev.strategicAttributionMigrated=true}}
 for(const f of Object.values(ws.factions||{})){f.strategicOutcomeEvidence=(f.strategicOutcomeEvidence||[]).filter(e=>{const ev=byEvent.get(e.eventId);if(ev?.strategicBeneficiaryFactionId&&ev?.strategicOpponentFactionId)return false;const empFaction=ws.employers?.[ev?.employerId]?.factionId||null;if(ev?.eventType==="contract_world_consequence"&&(ev.factionIds||[]).length>1&&empFaction&&f.id!==empFaction&&(e.roles||[]).includes("location_controller")){e.roles=["strategic_affected_neutral"];e.strategicRole="strategic_affected_neutral";e.legacyNeutralized=true}return true})}
 for(const ev of ws.history||[]){if(ev.eventType!=="contract_world_consequence"||!ev.strategicBeneficiaryFactionId||!ev.strategicOpponentFactionId)continue;const ids=[...new Set([ev.strategicBeneficiaryFactionId,ev.strategicOpponentFactionId,...(ev.factionIds||[])].filter(Boolean))];for(const fid of ids){const f=ws.factions?.[fid];if(!f)continue;f.strategicOutcomeEvidence=f.strategicOutcomeEvidence||[];const role=fid===ev.strategicBeneficiaryFactionId?"strategic_beneficiary":fid===ev.strategicOpponentFactionId?"strategic_opponent":"strategic_affected_neutral";if(!f.strategicOutcomeEvidence.some(e=>e.eventId===ev.id&&e.actorType===(ev.actorType||"unknown")))f.strategicOutcomeEvidence.push({eventId:ev.id,jobId:ev.jobId||null,situationId:ev.situationId||null,outcome:ev.outcome||ev.status||"unknown",actorType:ev.actorType||"unknown",actorId:ev.actorId||null,roles:[role],strategicRole:role})}}}
function playerFactionEvidence(f){return (f?.strategicOutcomeEvidence||[]).filter(e=>e.actorType==="player_company")}
function relationEvidenceWeight(e){const roles=new Set(e?.roles||[]),out=e?.outcome;if(roles.has("strategic_beneficiary"))return out==="success"?3:out==="failure"?-2:0;if(roles.has("strategic_opponent"))return out==="success"?-3:out==="failure"?-1:out==="withdrawal"?-1:0;if(roles.has("strategic_affected_neutral"))return 0;const base=out==="success"?1:out==="failure"?-1:0;return base*((roles.has("employer")?2:0)+(roles.has("location_controller")?1:0)||1)}
function deriveFactionRelationship(f){
 const ev=playerFactionEvidence(f),weighted=ev.map(e=>({...e,weight:relationEvidenceWeight(e)})),score=weighted.reduce((a,e)=>a+e.weight,0),positive=weighted.filter(e=>e.weight>0),negative=weighted.filter(e=>e.weight<0),neutral=weighted.filter(e=>e.weight===0),strategicOpposition=weighted.filter(e=>(e.roles||[]).includes("strategic_opponent")&&e.weight<0).length,meaningfulSuccesses=weighted.filter(e=>e.weight>0&&e.outcome==="success").length;
 let standing="neutral";if(strategicOpposition>=4&&score<=-8)standing="hostile";else if(negative.length>=2&&score<=-4)standing="distrustful";else if(score<0)standing="wary";else if(meaningfulSuccesses>=4&&negative.length===0&&score>=8)standing="trusted";else if(score>=2)standing="favorable";
 const recent=weighted.slice(-3),recentBalance=recent.reduce((a,e)=>a+e.weight,0),trend=recentBalance>0?"improving":recentBalance<0?"worsening":"stable";
 return {version:RELATIONSHIP_DERIVATION_VERSION,standing,trend,positiveCount:positive.length,negativeCount:negative.length,neutralCount:neutral.length,completedCount:ev.length,meaningfulSuccesses,strategicOpposition,score};
}
function deriveEmployerRelationship(e){
 const hist=(e?.contractHistory||[]).filter(x=>x.actorType==="player_company"),successes=hist.filter(x=>x.outcome==="success").length,failures=hist.filter(x=>x.outcome==="failure").length,withdrawals=hist.filter(x=>x.outcome==="withdrawal").length,completed=hist.length;
 const familiarity=completed===0?"unknown":completed===1?"known":completed<=3?"familiar":"established";
 let trust="neutral";if(failures>=3&&successes===0)trust="distrustful";else if(failures>successes)trust="wary";else if(successes>=4&&failures===0)trust="trusted";else if(successes>failures)trust="favorable";
 const recent=hist.slice(-3),recentBalance=recent.reduce((a,x)=>a+(x.outcome==="success"?1:x.outcome==="failure"?-1:0),0),trend=recentBalance>0?"improving":recentBalance<0?"worsening":"stable";
 return {version:RELATIONSHIP_DERIVATION_VERSION,familiarity,trust,trend,completed,successes,failures,withdrawals};
}
function refreshRelationshipDerivations(){
 const ws=game?.worldState;if(!ws)return;rebuildStrategicRelationshipEvidence();for(const f of Object.values(ws.factions||{})){const d=deriveFactionRelationship(f);f.companyRelationship=f.companyRelationship||{};f.companyRelationship.standing=d.standing;f.companyRelationship.derivation=d;f.companyRelationship.trustEvidence=playerFactionEvidence(f).filter(e=>relationEvidenceWeight(e)>0).map(e=>e.eventId);f.companyRelationship.hostilityEvidence=playerFactionEvidence(f).filter(e=>relationEvidenceWeight(e)<0).map(e=>e.eventId)}
 for(const e of Object.values(ws.employers||{})){const d=deriveEmployerRelationship(e);e.relationship=e.relationship||{};e.relationship.familiarity=d.familiarity;e.relationship.trust=d.trust;e.relationship.derivation=d}
}
function relationFactionPlayerEvidence(f){return (f?.strategicOutcomeEvidence||[]).filter(e=>e.actorType==="player_company").map(e=>{const ev=game.worldState.history.find(x=>x.id===e.eventId);return {...e,event:ev}}).sort((a,b)=>(b.event?.campaignHour??0)-(a.event?.campaignHour??0))}
function relationEmployerPlayerHistory(e){return (e?.contractHistory||[]).filter(x=>x.actorType==="player_company").slice().sort((a,b)=>(b.day||0)-(a.day||0))}
function relationActiveSituationsForFaction(fid){return Object.values(game.worldState.situations||{}).filter(s=>s.lifecycleState!=="Resolved"&&(s.affectedLocationIds||[]).some(lid=>game.worldState.locations[lid]?.controllerFactionId===fid))}
function relationOpenJobsForFaction(fid){return game.offers.filter(j=>{const emp=game.worldState.employers[j.identity?.employer?.id];return (j.identity?.employer?.factionId||emp?.factionId||emp?.alignedFactionId||null)===fid})}
function relationCauseText(e){const ev=e.event,roles=new Set(e.roles||[]),parts=[],b=ev?.strategicBeneficiaryFactionId?game.worldState.factions?.[ev.strategicBeneficiaryFactionId]:null,o=ev?.strategicOpponentFactionId?game.worldState.factions?.[ev.strategicOpponentFactionId]:null;if(roles.has("strategic_beneficiary"))parts.push(`${relationOutcomeLabel(e.outcome)} operation supporting ${b?.name||"this faction"}`);else if(roles.has("strategic_opponent"))parts.push(`${relationOutcomeLabel(e.outcome)} operation directed against ${o?.name||"this faction"}`);else if(roles.has("strategic_affected_neutral"))parts.push(`Affected by the conflict, but not a beneficiary or opponent`);else if(roles.has("employer"))parts.push(`${relationOutcomeLabel(e.outcome)} contract for a faction employer`);else if(roles.has("location_controller"))parts.push(`${relationOutcomeLabel(e.outcome)} operation affecting faction-controlled territory`);else parts.push(`${relationOutcomeLabel(e.outcome)} strategic involvement`);if(b&&o)parts.push(`Beneficiary: ${b.name}; Opponent: ${o.name}`);const w=relationEvidenceWeight(e);parts.push(w>0?`Standing effect +${w}`:w<0?`Standing effect ${w}`:`No standing effect`);return parts.join(" · ")}
function relationRecentEventHtml(e){const ev=e.event;if(!ev)return "";const job=ev.jobTitle||"Contract outcome";return `<div class="relation-event small"><b>Day ${ev.day||Math.floor((ev.campaignHour||0)/24)+1} · ${esc(job)}</b><br><span class="muted">${esc(relationCauseText(e))}</span>${ev.summary?`<br>${esc(ev.summary)}`:""}</div>`}
function relationEmployerHtml(e){const hist=relationEmployerPlayerHistory(e),loc=game.worldState.locations[e.homeLocationId],fac=game.worldState.factions[e.factionId],d=deriveEmployerRelationship(e);return `<div class="relation-employer"><div class="row wrap"><div><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.title||e.employerType||"Employer")}${loc?` · ${esc(loc.name)}`:""}</div></div><div class="relation-links"><span class="pill">Familiarity: ${esc(relationStandingLabel(d.familiarity))}</span><span class="pill">Trust: ${esc(relationStandingLabel(d.trust))}</span><span class="pill">Trend: ${esc(relationStandingLabel(d.trend))}</span></div></div><div class="tiny muted" style="margin-top:4px">${hist.length?`${hist.length} completed player contract${hist.length===1?"":"s"} · ${d.successes} success · ${d.failures} failure · ${d.withdrawals} withdrawal`:"No completed player contracts recorded"}${fac?` · ${esc(fac.name)}`:""}</div></div>`}
function relationFactionCard(f){const evidence=relationFactionPlayerEvidence(f),locs=(f.controlledLocationIds||[]).map(id=>game.worldState.locations[id]).filter(Boolean),emps=(f.knownEmployerIds||[]).map(id=>game.worldState.employers[id]).filter(Boolean),jobs=relationOpenJobsForFaction(f.id),situations=relationActiveSituationsForFaction(f.id),d=deriveFactionRelationship(f);return `<section class="card relation-card"><div class="relation-head"><div><div class="label">${esc(relationStandingLabel(f.factionType))}</div><h3 style="margin:3px 0;color:${factionMapStroke(f.id)}">${factionNameHtml(f.id,f.name,22)}</h3><div class="small muted">${esc(f.description||"")}</div></div><span class="badge relation-status">${esc(relationStandingLabel(d.standing))}</span></div><div class="relation-links" style="margin-top:7px"><span class="pill">Trend: ${esc(relationStandingLabel(d.trend))}</span><span class="pill">${d.positiveCount} positive evidence</span><span class="pill">${d.negativeCount} negative evidence</span>${d.neutralCount?`<span class="pill">${d.neutralCount} neutral evidence</span>`:""}</div><div class="tiny muted" style="margin-top:5px">Standing changes contract access and pay, available Strategic Commitments, and (when hostile forces control a Job site) actual reconnaissance threat exposure. Trusted factions may offer reserved strategic commissions. Strategic beneficiary/opponent evidence governs standing; affected-neutral involvement does not change it.</div>${factionRelationshipEffectsHtml(f.id)}<div class="divider"></div><div class="relation-section-title">Current relevance</div><div class="relation-links" style="margin-top:5px"><span class="pill">${jobs.length} open Job${jobs.length===1?"":"s"}</span><span class="pill">${situations.length} active Situation${situations.length===1?"":"s"}</span><span class="pill">${locs.length} controlled Location${locs.length===1?"":"s"}</span></div>${f.themes?.length?`<div class="relation-section-title">Known interests</div><div class="relation-links" style="margin-top:5px">${f.themes.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`:""}<div class="relation-section-title">Player history</div>${evidence.length?`<div class="relation-history">${evidence.slice(0,4).map(relationRecentEventHtml).join("")}</div>`:`<div class="small muted" style="margin-top:5px">No meaningful player contract outcomes recorded with this faction yet.</div>`}${emps.length?`<details style="margin-top:10px"><summary class="small"><b>Known employers (${emps.length})</b></summary><div style="margin-top:5px">${emps.map(relationEmployerHtml).join("")}</div></details>`:""}${locs.length?`<details style="margin-top:8px"><summary class="small"><b>Controlled locations (${locs.length})</b></summary><div class="small muted" style="margin-top:5px">${locs.map(l=>esc(l.name)).join(" · ")}</div></details>`:""}</section>`}
function relationsView(){refreshRelationshipDerivations();const fs=Object.values(game.worldState?.factions||{}).sort((a,b)=>a.name.localeCompare(b.name)),unaffiliated=Object.values(game.worldState?.employers||{}).filter(e=>!e.factionId);return `<div class="row wrap"><div><h2 style="margin:0">Relations</h2><div class="small muted">Evidence-based standing now affects contract access and terms, special strategic work, and hostile-location exposure. Employer trust remains historical.</div></div><span class="badge">Derived from history · no faction XP</span></div><div class="notice" style="margin-top:10px"><b>Strategic Relationship Attribution v0.1 · Relationship Derivation v0.2</b><br><span class="small">Strategic events classify each faction as Beneficiary, Opponent, or Affected Neutral. Beneficiary success is positive; direct opposition is negative even when the operation fails; affected-neutral events do not change standing. Repeated direct strategic opposition can become Hostile, while ordinary contract failure alone cannot.</span></div><div class="relations-grid">${fs.map(relationFactionCard).join("")}</div>${unaffiliated.length?`<h3 style="margin-top:14px">Independent / unaffiliated employers</h3><div class="card">${unaffiliated.map(relationEmployerHtml).join("")}</div>`:""}`}

function helpView(){const def=(term,copy)=>`<div class="help-def"><div class="help-term">${esc(term)}</div><div class="small">${copy}</div></div>`;return `<div class="row wrap"><div><h2 style="margin:0">Help & Game Reference</h2><div class="small muted">Persistent reference for the management loop, tabs, and core terminology. Help explains decisions; it does not make them for you.</div></div><span class="badge">v0.2.9</span></div><div class="help-jump" style="margin-top:10px"><button class="btn" onclick="document.getElementById('help-start').scrollIntoView()">Getting Started</button><button class="btn" onclick="document.getElementById('help-tabs').scrollIntoView()">Tabs</button><button class="btn" onclick="document.getElementById('help-exp').scrollIntoView()">Expeditions</button><button class="btn" onclick="document.getElementById('help-defs').scrollIntoView()">Definitions</button></div><div class="help-grid" style="margin-top:10px"><section class="card help-section" id="help-start"><h3>Getting Started</h3><div class="small">You run a mercenary company. The core loop is <b>evaluate Jobs → choose who to send → assign responsibilities → let the expedition resolve → read what happened → manage the changed roster and world</b>.</div><div class="divider"></div><div class="small"><b>Your main player skill is roster knowledge.</b> There is rarely one correct expedition. Compare relevant Skills, Applications, readiness, role suitability, current availability, and what capability you want to commit or develop.</div></section><section class="card help-section" id="help-tabs"><h3>What each tab does</h3>${def("Company","Your current company state: money, roster availability, active expeditions, payroll pressure, and recent high-level status.")}${def("Map","The primary campaign view. Inspect faction control, active territorial fronts, strategic facts, unstable Locations, expedition/rival activity, routes, contracts, and recent control changes.")}${def("Job Board","Open contracts created by world Situations. Read Why now / If successful / If unresolved, then choose which problems your company will address.")}${def("Roster","Compare mercenaries. Use presets, filters, sortable columns, readiness/injury status, role suitability, and detailed profiles to learn who is on the roster.")}${def("Recruitment","Evaluate available candidates and decide whether additional capability is worth the hiring and payroll cost.")}${def("Relations","Inspect evidence-based faction standing, employer familiarity/trust, meaningful contract history, controlled locations, and current world relevance. Standing is derived from actual player-company outcomes rather than faction XP.")}${def("Reports","Review completed expeditions, operational narrative, outcome causality, injuries, individual contributions, and development evidence.")}${def("Help","This reference. Return here whenever a term or screen is unclear.")}${def("Save / System","Save or export the campaign, import saves, start a new company, and enable optional playtest diagnostics.")}</section><section class="card help-section" id="help-exp"><h3>Expedition Assembly</h3><div class="small">Expedition membership and formal role assignments are <b>your decisions</b>. The game does not auto-select a party or Leader.</div><div class="divider"></div>${def("Party","Select the mercenaries you want to commit. Job cards show a recommended party range, but understrength expeditions remain possible when structurally legal.")}${def("Leader","Required. Owns consequential expedition priorities and course decisions. Leadership, Strategy, Tactics, temperament, and experience can all matter depending on context.")}${def("Scout","Optional responsibility for proactive reconnaissance and maintaining the situational picture.")}${def("Medic","Optional responsibility for medical truth, treatment, casualty assessment, and restrictions.")}${def("Quartermaster","Optional responsibility for expedition resources, sustainment, and material readiness.")}${def("Advisory information","Relevant Skills, suitability labels, coverage, and Strategist advice are decision support. They do not automatically choose for you.")}</section><section class="card help-section" id="help-defs"><h3>Core Definitions</h3>${def("Natural Aptitude","Relatively stable inherent capability: Intelligence, Awareness, Focus, Resilience, Strength, Endurance, Mobility, and Speed.")}${def("Learned Skill","A developed professional capability. Skills improve through meaningful use and evidence rather than generic character levels.")}${def("Application","A narrower reusable domain inside a broader Skill, represented as Unfamiliar, Familiar, or Specialized. Example: Survival / Animal Handling, Logistics / Vehicle Handling, or combat weapon families such as Melee Combat / Swords and Ranged Combat / Bows.")}${def("Weapon Application","Combat approaches now resolve through the weapon family actually selected for the acting mercenary. Swords, Axes, Blunt Weapons, Polearms, and Daggers sit under Melee Combat; Bows and Crossbows sit under Ranged Combat. Familiar/Specialized experience improves application-dependent performance; lack of experience is not a hard gate.")}${def("Readiness","Whether current condition affects deployment. Ready has no active readiness restriction; Limited Duty / Deployable With Limitation indicate an injury-related constraint; Not Deployable is a hard stop.")}${def("Role Suitability","A forecast of how well a mercenary fits a responsibility. It is decision support, not normally a permission gate.")}${def("Situation","An ongoing world problem or pressure that can create one or more related Employer Needs and Jobs.")}${def("Territorial Conflict","A persistent faction-versus-faction campaign focused on control of a specific Location. It records attacker, defender, stage, strategic facts, and eventual control outcome.")}${def("Strategic Fact","A persistent campaign advantage or setback created by meaningful operations, such as defensive intelligence, disrupted reinforcements, strengthened defenses, or an assault foothold. Strategic Facts influence later territorial resolution.")}${def("Control State","Controlled → Pressured → Contested → Captured → Consolidating. Control changes only through explicit strategic resolution; capture is followed by a vulnerable consolidation period.")}${def("World Event","An immutable causal record of something that happened in the world. Jobs and follow-up Situations retain lineage to their source events.")}${def("Job","A public contract responding to an Employer Need. Jobs can expire while the underlying Situation remains.")}${def("Job Challenge","Every newly generated Job has fixed intrinsic world difficulty: Routine, Demanding, or Formidable. The Company Outlook separately compares that fixed work to currently available roster capability and labels it Comfortable, Challenging, or Aspirational. Improving the company can therefore change the outlook without the world scaling to the player.")}${def("Objective Outcome","What objectives were achieved.")}${def("Operational Performance","How effectively the expedition operated considering casualties, time, resources, avoidable complications, and command.")}${def("Approach","The method selected by the expedition to address an Action Objective. Different approaches can rely on different Skills, Applications, risks, and actors.")}${def("Mission Capability Forecast","Pre-commitment decision support derived from currently known objectives and approaches. It highlights capabilities, relevant Applications, role signals, and known risk exposure without revealing hidden complications or prescribing one correct expedition.")}${def("Career Stage","Emerging → Developing → Established → Veteran. Professional maturity, not a character level or power tier.")}${def("Talent","Underlying Skill-specific development efficiency. Talent affects how readily experience becomes improvement; it is not a hard ceiling and is initially estimated rather than known exactly.")}${def("Potential Projection","An uncertain forecast range derived from current Skill, Natural Aptitudes, Skill Talent, age/career stage, and accumulated evidence. It can narrow or change over time and is not destiny.")}${def("Assessment Confidence","How much evidence the company has behind a recruit assessment. Low confidence means wider Aptitude/Talent/projection ranges, not deliberately false information.")}${def("Career Statistics","Authoritative career totals derived from resolved simulation events: service, outcomes, Primary Actions, leadership, roles, Skill use, injuries, world experience, and campaign-year splits. They are records, not ratings.")}${def("Character Names","Generated names use a large shared pool with duplicate and near-duplicate suppression among active characters. Recruit names can be rerolled without changing the recruit, and hired mercenaries can be renamed from their profile without changing identity or career history.")}${def("Activity Status","Mercenaries are labeled At HQ, Traveling, Road Camp, Operating, Returning, Training, or Recovering from existing assignment/readiness state.")}${def("Career Label / Known For","Short descriptive identity summaries derived from recorded career history. They are not classes, ratings, or progression tiers.")}${def("Job Urgency","Routine / Time-Sensitive / Urgent / Critical presentation derived from remaining listing time and active territorial-conflict stage. It does not alter Job resolution.")}${def("Route State","Open / Risky / Disrupted / Contested / Blocked presentation derived from route access, threat, and active territorial conflict.")}${def("Recruit Temperament","A concise behavioral summary derived from Curiosity, Sociability, Empathy, Accommodation, Assertiveness, and Composure. In this RC it is descriptive context; broader behavioral runtime consequences remain future work.")}${def("Recruit Best Fit","A current-capability summary derived from Skills and role suitability. It is advisory and does not restrict assignment.")}${def("Company Name","The company can be renamed from the Company screen without changing campaign identity or historical records.")}${def("Progressive Reports","Post-Job Reports surface outcome, world impact, important events, injuries, career moments, and standout mercenaries first. Full objective narration, resolution math, and alternative approaches remain available in expandable detail sections.")}${def("Faction Sigils","Crown Remnant, Fenward League, Merchant Compact, and Ash Banner use consistent lightweight sigils across Jobs, Map, Relations, and Reports. Sigils are presentation identifiers only.")}${def("Command Recovery","Leadership does not improve another mercenary's Primary Action grade. After Mixed/Poor objectives, the expedition Leader may contain secondary consequences such as detection escalation, casualty exposure, delay, or mission-level collapse. Successful interventions add Command Strain, making repeated recovery harder. Strong recovery after a Poor result can create a controlled fallback while the original Poor result remains recorded.")}${def("Strategic Commitment","A long-duration faction assignment tied to an active territorial conflict. Mercenaries assigned to it remain unavailable for ordinary Jobs and training until the term ends. Commitments generate Scout reconnaissance incidents and Quartermaster sustainment incidents based on Recon Exposure and Sustainment Pressure, and successful service can create a Strategic Fact. Completing or breaking an assignment now creates a grounded After-Action Report in Reports.")}${def("Scout Intervention","An assigned Scout does not improve another mercenary’s Primary Action. Scouts identify hidden approach threats, contain detection/exposure escalation, and manage Recon Exposure during Strategic Commitments. Context chooses Tracking, Navigation, Stealth, or Survival; repeated successful interventions build Recon Load, while Strong results can create a temporary Intelligence Edge.")}${def("Quartermaster Intervention","An assigned Quartermaster uses Logistics with bounded Administration/Focus support to contain actual travel/camp logistics delays and sustained Strategic Commitment supply/readiness incidents. Successful containment builds Sustainment Load. There is no passive Primary Action bonus and no imaginary consumables inventory.")}${def("Faction Relationship Consequences","Faction standing now affects whether employers accept your company, relationship pay bonuses (+5% Favorable / +10% Trusted), Trusted-only commissions generated during active conflicts, and a 50% failure guarantee on Trusted Strategic Commitments. Hostile-controlled Job sites have more reconnaissance-threat exposure. Terms lock when you accept the work; standing never retroactively modifies an active assignment. No automatic penalties are imposed on unrelated factions.")}${def("Company Crisis & Recovery","Viability is derived from actual roster readiness, wages, incoming work and affordable recruitment. Serious combined pressures trigger an explainable Company Crisis; dissolution requires a sustained seven-day absence of any credible operational or rebuilding path. Debt alone cannot end a campaign. Check Company for live blockers and actions.")}${def("Payroll & Retention","Every 30 days wages become individual obligations. Allocate cash or make partial payments from Company. Unpaid wages create gradually escalating personal grievances; prolonged nonpayment restricts new strategic commitments, then all new assignments, and can eventually cause departures. Deployed mercenaries finish existing work. Debt persists after departure; promises must be honored.")}${def("Compensation Reviews","Each mercenary has a stable agreed salary and a separate career-based compensation expectation. Ordinary reviews are protected for 60 days after an agreement; exceptional high-level Skill breakthroughs may trigger an earlier review. Unresolved reviews can eventually restrict new work or cause departure after protected assignments finish. Agreed raises become normal payroll obligations; salary disputes are not wage arrears.")}${def("Field Stabilization","An assigned expedition Medic does not prevent the original injury. When an injury occurs, Medicine plus bounded Focus/Awareness support determines whether field treatment prevents a possible complication and shortens recovery. Multiple casualties build Medical Load, making later treatment harder. No Medicine development is awarded unless actual treatment occurs.")}${def("Development Evidence","Meaningful Skill exercise produces visible Development Progress. Stretch, Practice, and Consolidation contribute at different rates; Talent, career stage, result quality, and challenge relative to current Skill affect progress. Thresholds rise sharply at high Skill ratings, so early growth is faster while elite improvement remains rare.")}</section></div>`}
function systemView(){return `${crisisRecoveryPanel()}<div class="grid grid2"><div class="card stack"><h3>Save / Load</h3><button class="btn primary" onclick="save()">Save to browser</button><button class="btn" onclick="load()">Load browser save</button><button class="btn" onclick="exportSave()">Export save JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import save JSON</button><button class="btn bad" onclick="resetGame()">New company</button></div><div class="card"><h3>Build scope</h3><div class="small muted">Playable Base v0.2.9, superseding v0.2.8: Strategic World State Phase A and Strategic Map Presentation Phase B are active alongside causal world Situations, world-driven Jobs, route travel, Personnel Sufficiency, the dynamic Job market, rivals, and causal consequences.</div><div class="divider"></div><div class="small">Mobile Strategic Map, Character Naming & Rename v0.1, World Feedback & Identity v0.1 (World Events, Job faction/opponent badges, What Changed?, Career Milestones, Relationship Cause History), Company & Character Identity UX v0.1 (activity markers, Known For, urgency, route states, career labels, temperament hooks, recruit fit, company rename), Recent Notices, Founding Company Draft, Operational Narrative v0.5 + Technical Interaction Context v0.1 + Objective Distinctness & Approach Reuse v0.1, Mercenary Career Statistics & Records v0.1, Roster Comparison with visible injury/readiness limits, persistent Help, manual Expedition Assembly, Injury Causality, understrength-success reporting, the approved Skill taxonomy, Starting Capability Recalibration v0.1, Development Progress v0.1, Job Difficulty Distribution v0.1, Medic Field Stabilization v0.1, Scout Role Intervention v0.1, Quartermaster Role Intervention v0.1, Strategic Commitments v0.1, Payroll & Retention v0.1, Mercenary Compensation & Career Expectations v0.1, Company Crisis & Recovery v0.1, Strategic Commitment After-Action Reports v0.1, and Faction Relationship Consequences v0.1 are active.</div></div></div><div class="card" style="margin-top:12px"><div class="row"><div><h3 style="margin:0">Playtest Diagnostics</h3><div class="small muted">Optional trace and session export. Does not affect resolution.</div></div><button class="btn ${game.diagnosticsEnabled?"good":""}" onclick="setDiagnosticsEnabled(!game.diagnosticsEnabled)">${game.diagnosticsEnabled?"Enabled":"Enable"}</button></div>${game.diagnosticsEnabled?`<div class="divider"></div><div class="row"><span class="small">${diagnosticsSummary().eventCount} trace events · session ${esc(diagnosticsSummary().sessionId)}</span><button class="btn" onclick="exportDiagnostics()">Export diagnostics JSON</button></div>`:""}</div>${compensationReviewsPanel()}${payrollPanel()}<h3>Ledger</h3><div class="card">${game.ledger.slice().reverse().slice(0,30).map(x=>`<div class="row small"><span>Day ${x.day} · ${esc(x.description)}</span><b class="money ${x.amount>=0?"pos":"neg"}">${money(x.amount)}</b></div>`).join("")}</div>`}

function confirmFire(id){const m=merc(id);if(!m)return;document.getElementById("modalTitle").textContent=`Dismiss ${m.name}?`;document.getElementById("modalBody").innerHTML=`<div class="notice warn"><b>This permanently removes ${esc(m.name)} from the active roster.</b><br><span class="small">Future payroll falls by ${money(m.payroll)}. Unpaid wages remain company obligations after dismissal. Career History is preserved in the former-mercenary archive. No recruit appears automatically.</span></div><div class="row" style="margin-top:12px"><button class="btn" onclick="showMerc('${m.id}')">Cancel</button><button class="btn bad" onclick="fireMercenary('${m.id}')">Confirm Firing</button></div>`}
function causalityHtml(r){const c=r.outcomeCausality;if(!c)return "";const success=r.outcome==="success",title=success?"Why this mission succeeded":r.outcome==="withdrawal"?"Why this ended in withdrawal":"Why this mission failed";return `<h4>${title}</h4><div class="notice ${r.outcome==="failure"?"bad":r.outcome==="withdrawal"?"warn":"good"}"><b>${esc(c.primaryCause)}</b><div class="small" style="margin-top:5px">${esc(c.summary)}</div>${c.completionRequirement!=null?`<div class="small" style="margin-top:6px"><b>Completion:</b> ${fmt3(c.accumulatedProgress)} progress vs ${fmt3(c.completionRequirement)} required</div>`:""}${success&&c.decisiveContributions?.length?`<div class="small" style="margin-top:6px"><b>Decisive contributions</b>${c.decisiveContributions.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${success&&c.unresolvedSetbacks?.length?`<div class="small" style="margin-top:6px"><b>Unresolved pressure</b>${c.unresolvedSetbacks.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${!success?`<div class="divider"></div><div class="small"><b>Proximal trigger:</b> ${esc(c.proximalTrigger||"Not recorded")}</div>`:""}${!success&&c.contributors?.length?`<div class="small" style="margin-top:6px"><b>Contributing factors</b>${c.contributors.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${c.levers?.length?`<div class="small" style="margin-top:6px"><b>What could have changed the outcome?</b>${c.levers.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}</div>`}
function understrengthSuccessHtml(r){const u=r.understrengthSuccess;if(!u)return "";return `<div class="notice warn" style="margin-top:8px"><b>${esc(u.label)} — ${esc(u.band)}</b><div class="small">The expedition completed the contract with ${u.actual} mercenaries${u.recommended?` against a recommended party of ${esc(String(u.recommended))}`:""}. ${esc(u.summary||"")}</div><div class="tiny muted">Peak operational commitments ${u.maxOperationalCommitments??0} · sustainment burden ${fmt3(u.sustainmentBurden||0)}</div></div>`}
function injuryCausalityHtml(r){if(!r.injuries?.length)return `<div class="small muted">None</div>`;return r.injuries.map(x=>{const primary=x.primaryActorName&&x.primaryActorName!==x.actorName?` while supporting ${esc(x.primaryActorName)}'s ${esc(mechanismPhrase(x.approach||"operation"))}`:` during ${esc(mechanismPhrase(x.approach||"the operation"))}`;const ctx=x.operation&&x.primitive?`${esc(x.operation)} / ${esc(x.primitive)}`:"operational activity",ft=x.fieldTreatment;const treatment=ft?`<div class="small ${ft.success?"good":ft.complicationOccurred?"warn":"muted"}" style="margin-top:5px"><b>${ft.assigned?`Medic — ${esc(ft.medicName)}`:"No Medic assigned"}</b> · ${esc(ft.label||"")}</div><div class="tiny muted">${esc(ft.narrative||"")} Recovery ${ft.recoveryDaysBefore}d → ${ft.recoveryDaysAfter}d${ft.attempted?` · Medicine ${ft.medicine} + ${Number(ft.aptitudeSupport)>=0?"+":""}${fmt3(ft.aptitudeSupport)} aptitude support + ${Number(ft.varianceRoll)>=0?"+":""}${fmt3(ft.varianceRoll)} variance − ${fmt3(ft.difficulty)} difficulty = ${Number(ft.margin)>=0?"+":""}${fmt3(ft.margin)} · Medical Load ${ft.medicalLoadBefore}`:""}</div>`:"";return `<div class="notice warn" style="margin:6px 0"><b>${esc(x.actorName)} — ${esc(x.severity)} injury</b><div class="small">Wounded${primary}. Cause: ${ctx}; casualty exposure ${esc(x.casualtyExposure||"unknown")}${x.result?` with a ${esc(String(x.result).toUpperCase())} resolution`:""}.</div>${x.context?`<div class="tiny muted">Context: ${esc(x.context)}</div>`:""}${treatment}</div>`}).join("")}
function eventNarrativeHtml(e){const n=e.narrative;if(!n)return e.context?`<div class="small">${esc(e.context)}</div>`:"";return `<div class="small" style="margin:6px 0"><div>${esc(n.situation)}</div><div>${esc(n.action)}</div>${n.complication?`<div>${esc(n.complication)}</div>`:""}<div><b>${esc(n.result)}</b> ${esc(n.consequence)}</div></div>`}


document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importSave(e.target.files[0])});
game=normalizeGameState(game);
refreshRelationshipDerivations();
bootstrap();
telemetryInit();
window.__MCS_TEST__={
  snapshot:()=>deep(game),
  diagnostics:()=>diagnosticsExportObject(),
  reset:()=>{game=normalizeGameState(freshGameState());bootstrap();telemetryInit();currentTab="dashboard";selectedJobId=null;selectedCommitmentId=null;selectedParty=[];selectedLeader="";selectedRoles={scout:"",medic:"",quartermaster:""};render();return deep(game)},
  advance:()=>{advance();return deep(game)},
  rivals:()=>deep(game.rivalCompanies),worldHistory:()=>deep(game.worldState.history),worldCausality:()=>({situations:deep(game.worldState.situations),employerNeeds:deep(game.worldState.employerNeeds),offers:deep(game.offers),strategicConflicts:deep(game.worldState.strategicConflicts||{}),strategicFacts:deep(game.worldState.strategicFacts||{}),locationControl:Object.fromEntries(Object.values(game.worldState.locations||{}).map(l=>[l.id,{controllerFactionId:l.controllerFactionId,controlStatus:l.state?.controlStatus||null}]))}),build:BUILD_INFO
};
render();


</script>

.card h3,.card h4{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}

.stat{font-size:23px;font-weight:800}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.divider{height:1px;background:var(--line);margin:10px 0}
.job{border-left:4px solid var(--blue)}.job.selected{border-left-color:var(--accent)}.goodline{border-left:4px solid var(--good)}.warnline{border-left:4px solid var(--warn)}.badline{border-left:4px solid var(--bad)}

select{background:#111418;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.coverage .ao{border-top:1px solid var(--line);padding:7px 0}.coverage .ao:first-child{border-top:0}

}

function buildEventNarrative(job,ao,ev,index){const place=job.identity?.location?.name||"the contract site",target=job.identity?.target||"objective";const situation=ao.context?`${ao.context} created immediate operational friction at ${place}.`:`${ao.operation} work at ${place} required the company to ${primitivePhrase(ao.primitive)} concerning the ${target}.`;const action=`${ev.actorName} responded with ${mechanismPhrase(ev.approach)}.`;const result=ev.result==="strong"?"The action decisively advanced the objective.":ev.result==="solid"?"The action advanced the objective without fully eliminating risk.":ev.result==="mixed"?"The action made limited progress and left meaningful pressure unresolved.":"The action failed to produce the needed progress and increased operational pressure.";const consequence=ao.context?`The ${String(ao.context).toLowerCase()} remained part of the immediate situation.`:ev.result==="poor"?"The expedition continued with less margin for another setback.":"The expedition proceeded to the next objective.";return {situation,action,result,consequence}}

function ensureTelemetry(){

function logDiag(type,data={}){

  if(game.telemetry.events.length>5000) game.telemetry.events=game.telemetry.events.slice(-5000);

function diagnosticsSummary(){
  ensureTelemetry();
  const es=game.telemetry.events, counts={};
  es.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
  const accepted=counts.expedition_committed||0, completed=counts.expedition_completed||0;
  const coverage={Broad:0,Narrow:0,"Severe Gap":0};
  es.filter(e=>e.type==="coverage_snapshot").forEach(e=>{if(e.data.band in coverage)coverage[e.data.band]++});
  const skills={},apps={};
  game.reports.forEach(r=>(r.events||[]).forEach(e=>{if(e.skill)skills[e.skill]=(skills[e.skill]||0)+1;if(e.application)apps[e.application]=(apps[e.application]||0)+1}));
  return {
    sessionId:game.telemetry.sessionId,
    build:BUILD_INFO.build,
    campaignDay:game.day,
    eventCount:es.length,
    eventTypes:counts,
    jobs:{offered:counts.job_offered||0,accepted,completed,expired:counts.job_expired||0,declined:counts.job_declined||0},
    coverage,
    finances:{cash:game.cash,payroll:payrollTotal(),nextPayrollDay:game.nextPayrollDay},
    roster:{total:game.roster.length,available:game.roster.filter(available).length,former:(game.alumni||[]).length,activeExpeditions:game.activeExpeditions.length},
    recruitment:{listed:game.recruits.length,nextArrivalDay:game.nextRecruitDay},

 <div class="row" style="margin-top:8px"><button class="btn" onclick="selectJob('${j.id}')">Assemble expedition</button><button class="btn bad" onclick="declineJob('${j.id}')">Decline</button></div></div>`;
}
function selectJob(id){selectedJobId=id;selectedParty=[];selectedLeader="";selectedRoles={scout:"",medic:"",quartermaster:""};const selected=game.offers.find(x=>x.id===id);if(selected)logDiag("job_selected",{jobId:selected.id,title:selected.title,identity:selected.identity,primaryOperation:selected.primaryOperation,reward:selected.reward});const av=game.roster.filter(available).sort((a,b)=>(b.skills.Leadership||0)-(a.skills.Leadership||0));if(av.length){const job=game.offers.find(x=>x.id===id);selectedParty=autoParty(job,av,Math.min(4,av.length));selectedLeader=selectedParty.slice().sort((a,b)=>(merc(b).skills.Leadership||0)-(merc(a).skills.Leadership||0))[0]||""}render()}
function autoParty(job,av,n){
 const wanted=new Set();job.objectives.forEach(o=>o.approaches.forEach(a=>a.skill&&wanted.add(a.skill)));const leader=av.slice().sort((a,b)=>b.skills.Leadership-a.skills.Leadership)[0],sel=[leader.id],rem=av.filter(x=>x.id!==leader.id);
 while(sel.length<n&&rem.length){rem.sort((a,b)=>{const sc=x=>[...wanted].reduce((s,k)=>s+(x.skills[k]||0),0);return sc(b)-sc(a)});sel.push(rem.shift().id)}return sel
}
function toggleParty(id,on){if(on){if(!selectedParty.includes(id))selectedParty.push(id)}else{selectedParty=selectedParty.filter(x=>x!==id);if(selectedLeader===id)selectedLeader="";for(const k of Object.keys(selectedRoles))if(selectedRoles[k]===id)selectedRoles[k]=""}render()}
function assemblePanel(){
 const j=game.offers.find(x=>x.id===selectedJobId);if(!j)return "";const av=game.roster.filter(available),cov=selectedParty.length?coverage(j,selectedParty):null,advice=strategistAdvice(j);
 const roleSelect=role=>`<label class="small muted" style="display:block;margin-top:8px">${role[0].toUpperCase()+role.slice(1)} <span class="tiny">(optional)</span></label><select style="width:100%" onchange="selectedRoles.${role}=this.value;render()"><option value="">Unassigned</option>${selectedParty.map(id=>{const m=merc(id),fit=roleSuitability(m,role);return `<option value="${id}" ${selectedRoles[role]===id?"selected":""}>${m.name} · ${fit.label} fit · ${fit.detail}</option>`}).join("")}</select>`;
 const identity=j.identity?`<div class="notice" style="margin-bottom:10px"><b>${esc(j.identity.employer.name)}</b> · ${esc(j.identity.employer.faction)}<br><span class="small">${esc(j.identity.location.name)}, ${esc(j.identity.location.region)} · Target: ${esc(j.identity.target)}</span></div>`:"";
 return `<div class="card"><h3>${esc(j.title)}</h3>${identity}<div class="small muted">Recommended party ${j.recommendedParty.join("–")} · Leader required · Scout/Medic/Quartermaster optional</div><div class="divider"></div>
 <div class="stack">${av.map(m=>`<label class="member"><input type="checkbox" ${selectedParty.includes(m.id)?"checked":""} onchange="toggleParty('${m.id}',this.checked)"><span><b>${esc(m.name)}</b><div class="tiny muted">Age ${m.age} · ${m.careerStage} · Lead ${m.skills.Leadership} · ${topSkills(m,3)}</div></span></label>`).join("")}</div>
 <div class="divider"></div><label class="small muted">Leader</label><select style="width:100%" onchange="selectedLeader=this.value;render()"><option value="">— choose —</option>${selectedParty.map(id=>`<option value="${id}" ${selectedLeader===id?"selected":""}>${merc(id).name} · Leadership ${merc(id).skills.Leadership}</option>`).join("")}</select>
 ${roleSelect("scout")}${roleSelect("medic")}${roleSelect("quartermaster")}<div class="tiny muted" style="margin-top:6px">Optional roles are responsibilities, not deployment gates. Poor-fit or vacant roles remain legal.</div>
 <label class="small muted" style="display:block;margin-top:8px">Risk policy</label><select style="width:100%" onchange="selectedPolicy=this.value;render()">${["cautious","balanced","aggressive"].map(x=>`<option ${selectedPolicy===x?"selected":""}>${x}</option>`).join("")}</select>
 <div class="divider"></div><div class="notice"><b>Strategist advisory</b><br><span class="small">${advice.actor?`${advice.actor.name}: `:""}${advice.text}</span></div>${cov?coverageHtml(cov):""}<button class="btn primary" style="width:100%;margin-top:10px" ${!selectedLeader||!selectedParty.length?"disabled":""} onclick="commitSelected()">Commit expedition</button></div>`;
}
function coverageHtml(c){
 const cls=c.band==="Broad"?"good":c.band==="Narrow"?"warn":"bad";
 return `<div class="coverage notice ${cls}" style="margin-top:10px"><div class="row"><b>Approach Coverage: ${c.band}</b><span class="pill">Advisory</span></div><div class="small">${esc(c.summary)}</div>${c.rows.map(r=>`<div class="ao"><b class="small">${r.o.operation} · ${r.o.primitive}${r.o.context?` · ${r.o.context}`:""}</b><div class="tiny muted">${r.credible.length} credible of ${r.methods.length} methods</div>${r.credible.slice(0,3).map(x=>`<div class="tiny">✓ ${x.a.mechanism} — ${x.b.m.name} · ${x.b.p.kind==="aptitude"?"Aptitude "+x.b.p.label:x.a.application?`${x.a.skill} + ${x.a.application}`:x.a.skill}</div>`).join("")}</div>`).join("")}</div>`;
}
function rosterView(){return `<div class="row"><div><h2 style="margin:0">Roster</h2><div class="small muted">${game.roster.length} active · ${game.alumni.length} former mercenaries</div></div></div><div class="grid grid2" style="margin-top:10px">${game.roster.map(m=>`<div class="card"><div class="row"><div><b>${esc(m.name)}</b><div class="small muted">Age ${m.age} · ${m.careerStage}</div></div><span class="pill">${esc(m.assignment?`Assigned until D${m.availableDay}`:m.readiness)}</span></div><div class="small">${topSkills(m,5)}</div><div class="pills" style="margin-top:7px"><span class="pill">${m.careerStretchActions||0} career Stretch</span>${Object.entries(m.applications||{}).map(([k,v])=>`<span class="pill">${esc(k)}: ${esc(v)}</span>`).join("")}</div><button class="btn" style="margin-top:8px" onclick="showMerc('${m.id}')">Details</button></div>`).join("")}</div>`}
function topSkills(m,n){return Object.entries(m.skills).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n).map(x=>`${x[0]} ${x[1]}`).join(" · ")}
function showMerc(id){
 const m=merc(id);if(!m)return;const stretchHistory=m.careerHistory.filter(h=>h.evidenceKind==="Stretch").slice(-8).reverse();document.getElementById("modalTitle").textContent=m.name;
 document.getElementById("modalBody").innerHTML=`<div class="row"><div><b>Age ${m.age} · ${m.careerStage}</b><div class="small muted">${m.readiness} · payroll ${money(m.payroll)}</div></div><div>${m.assignment?`Assigned until D${m.availableDay}`:"Available"}</div></div>
 <div class="notice" style="margin-top:10px"><b>${m.stretchCountLegacy?"Recorded":"Career"} Stretch actions: ${m.careerStretchActions||0}</b><div class="tiny muted">Historical challenge evidence, not XP.${m.stretchCountLegacy?" Legacy saves may not contain Stretch evidence that was already realized before v0.1.3.":""}</div>${stretchHistory.map(h=>`<div class="tiny">Day ${h.day} · ${esc(h.skill||h.aptitude||"Activity")} · ${esc((h.approach||"").replaceAll("_"," "))} ${h.result?`· ${esc(h.result)}`:""}</div>`).join("")||`<div class="tiny muted">No detailed Stretch records in this save yet.</div>`}</div>
 <h4>Aptitudes</h4><div class="skillgrid">${Object.entries(m.aptitudes).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Learned Skills</h4><div class="skillgrid">${Object.entries(m.skills).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Applications</h4><div class="pills">${Object.entries(m.applications||{}).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("")||"None"}</div>
 <h4>Recent Career History</h4>${m.careerHistory.slice(-10).reverse().map(h=>`<div class="small report-event">Day ${h.day} · ${esc(h.type)} ${h.skill?`· ${esc(h.skill)}`:""} ${h.evidenceKind?`· ${esc(h.evidenceKind)}`:""} ${h.result?`· ${esc(h.result)}`:""}</div>`).join("")||`<div class="muted small">No events yet.</div>`}
 <div class="divider"></div><button class="btn bad" style="width:100%" ${available(m)&&game.roster.length>1?"":"disabled"} onclick="confirmFire('${m.id}')">Fire Mercenary</button>${!available(m)?`<div class="tiny muted" style="margin-top:5px">Mercenaries can only be dismissed while physically available to the company.</div>`:""}`;modal.showModal()
}
function recruitView(){const until=game.nextRecruitDay-game.day;return `<div class="row"><div><h2 style="margin:0">Recruitment</h2><div class="small muted">Next market arrival approximately Day ${game.nextRecruitDay} (${Math.max(0,until)} days). Hiring does not trigger replacement.</div></div></div><div class="grid grid2" style="margin-top:10px">${game.recruits.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">Age ${c.age} · ${c.careerStage} · leaves after Day ${c.expiresDay}</div></div><div style="text-align:right"><b>${money(c.hireCost)}</b><div class="tiny muted">${money(c.payroll)}/payroll</div></div></div><div class="small">${topSkills(c,5)}</div><button class="btn" style="margin-top:8px" onclick="hire('${c.id}')">Hire</button></div>`).join("")||`<div class="card muted">No candidates are currently available. The market will refill on its own schedule.</div>`}</div>`}
function reportsView(){return `<h2>Post-Job Reports</h2><div class="stack">${game.reports.map((r,i)=>`<div class="card ${r.outcome==="success"?"goodline":"warnline"}"><div class="row"><div><b>${esc(r.title)}</b><div class="small muted">Day ${r.day} · ${r.outcome.toUpperCase()}</div></div><b>${money(r.reward+r.bonus)}</b></div><div class="small">${r.party.join(", ")}</div><button class="btn" style="margin-top:7px" onclick="showReport(${i})">Open report</button></div>`).join("")||`<div class="card muted">No completed Jobs yet.</div>`}</div>`}
function fmt3(n){return Number(n??0).toFixed(2)}
function capabilityLabel(a){return a.aptitude?`Aptitude ${a.aptitude}`:a.application?`${a.skill} + ${a.application}${a.applicationExperience&&a.applicationExperience!=="none"?` (${a.applicationExperience})`:""}`:(a.skill||"Unknown")}
function selectionMathHtml(a){
 const m=a.selectionMath||{};
 const fallback=a.fallbackPenalty?` − ${fmt3(a.fallbackPenalty)} fallback`:"";
 return `<div class="tiny muted">Selection score: ${fmt3(m.capabilityMargin)} capability margin − ${fmt3(m.riskPenalty)} risk − ${fmt3(m.detectionPenalty)} detection − ${fmt3(m.timePenalty)} time − ${fmt3(m.resourcePenalty)} resources${fallback} = <b>${fmt3(a.selectionScore)}</b></div>`;
}
function availableApproachesHtml(e){
 const rows=e.availableApproaches||[];
 if(!rows.length)return `<div class="tiny muted">Approach audit was not recorded in this older report.</div>`;
 return `<details style="margin-top:8px"><summary class="small"><b>Available approaches (${rows.length})</b></summary><div style="margin-top:6px">${rows.map(a=>`<div class="card" style="padding:8px;margin:6px 0;background:#121519"><div class="row"><div><b>${a.chosen?"✓ ":""}${esc(a.mechanism)}</b>${a.chosen?` <span class="pill">CHOSEN</span>`:""}</div><span class="pill">${a.credible?"Credible":"Fallback"}</span></div><div class="tiny">Best actor: <b>${esc(a.bestActorName)}</b> · ${esc(capabilityLabel(a))}</div><div class="tiny muted">Capability ${fmt3(a.effective)} · base difficulty ${fmt3(a.baseDifficulty)}${a.applicationModifier?` + app modifier ${fmt3(a.applicationModifier)}`:""} = adjusted difficulty ${fmt3(a.adjustedDifficulty)}</div><div class="tiny muted">Risk ${a.casualty} · detection ${a.detection} · ${fmt3(a.timeHours)}h · ${money(a.resource)}</div>${selectionMathHtml(a)}${!a.considered?`<div class="tiny muted">Not considered for selection because at least one credible method existed.</div>`:""}</div>`).join("")}</div></details>`;
}
function resultMathHtml(e){
 const m=e.resultMath||{effective:e.effective,varianceRoll:e.varianceRoll,adjustedDifficulty:e.difficulty,margin:e.margin};
 if(m.varianceRoll===undefined||m.varianceRoll===null)return `<div class="tiny muted">Legacy report: deterministic variance roll was not recorded.</div>`;
 return `<div class="notice" style="margin-top:7px"><b class="small">Resolution math</b><div class="small"><b>${fmt3(m.effective)}</b> effective capability + <b>${Number(m.varianceRoll)>=0?"+":""}${fmt3(m.varianceRoll)}</b> variance − <b>${fmt3(m.adjustedDifficulty)}</b> adjusted difficulty = <b>${Number(m.margin)>=0?"+":""}${fmt3(m.margin)}</b> margin → ${e.result.toUpperCase()}</div><div class="tiny muted">Strong ≥ +2 · Solid ≥ 0 · Mixed ≥ −2 · Poor &lt; −2</div></div>`;
}
function showReport(i){
 const r=game.reports[i];logDiag("report_opened",{reportId:r.id,jobTitle:r.title,outcome:r.outcome});const identity=r.identity?`<div class="notice" style="margin-top:8px"><b>${esc(r.identity.employer.name)}</b> · ${esc(r.identity.employer.faction)}<br><span class="small">${esc(r.identity.location.name)}, ${esc(r.identity.location.region)} · Target: ${esc(r.identity.target)}</span></div>`:"",roles=r.roles?`<div class="small muted">Roles: Scout ${r.roles.scout||"Unassigned"} · Medic ${r.roles.medic||"Unassigned"} · Quartermaster ${r.roles.quartermaster||"Unassigned"}</div>`:"";
 document.getElementById("modalTitle").textContent=r.title;document.getElementById("modalBody").innerHTML=`<div class="row"><b>${r.outcome.toUpperCase()}</b><b>${money(r.reward+r.bonus)}</b></div><div class="small muted">Leader ${r.leader} · ${r.party.join(", ")}</div>${roles}${identity}${causalityHtml(r)}
 <h4>Operational narrative</h4>${r.events.map((e,idx)=>`<div class="report-event"><div class="row"><b>${idx+1}. ${e.operation} · ${e.primitive}</b><span class="pill">${e.result.toUpperCase()}</span></div>${eventNarrativeHtml(e)}<div class="tiny muted">${e.skill?e.application?`${e.skill} + ${e.application}`:e.skill:`Aptitude ${e.aptitude}`} · casualty ${e.casualty} · detection ${e.detection}${e.evidenceKind?` · ${e.evidenceKind}`:""}</div>${resultMathHtml(e)}${availableApproachesHtml(e)}</div>`).join("")}
 <h4>Injuries</h4>${r.injuries.map(x=>`<div>${x.actorName}: ${x.severity}</div>`).join("")||`<div class="small muted">None</div>`}<h4>Career moments</h4>${r.stretchMoments?.length?r.stretchMoments.map(x=>`<div class="notice"><b>${esc(x.actorName)} — Stretch</b><div class="small">${esc(x.skill)}${x.application?` / ${esc(x.application)}`:""} · ${esc(x.approach.replaceAll("_"," "))} · ${esc(x.result)} · career Stretch #${x.careerStretchActions}</div></div>`).join(""):`<div class="small muted">No Stretch actions recorded on this Job.</div>`}<h4>Development</h4>${r.devNotes.map(x=>`<div>${x}</div>`).join("")||`<div class="small muted">Evidence recorded; no Skill realization this Job.</div>`}`;modal.showModal()
}
function systemView(){return `<div class="grid grid2"><div class="card stack"><h3>Save / Load</h3><button class="btn primary" onclick="save()">Save to browser</button><button class="btn" onclick="load()">Load browser save</button><button class="btn" onclick="exportSave()">Export save JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import save JSON</button><button class="btn bad" onclick="resetGame()">New company</button></div><div class="card"><h3>Build scope</h3><div class="small muted">Playable Base v0.1.3 adds contextual narration, outcome causality, career Stretch presentation, persistent contract identity, expedition role assignment, natural recruit-market turnover, roster dismissal, age/detail cleanup, and unique recruit identity.</div><div class="divider"></div><div class="small">The full strategic world map remains a later milestone. Economy reward/payroll values were intentionally not rebalanced until the new recruitment lifecycle can be play-tested.</div></div></div><div class="card" style="margin-top:12px"><div class="row"><div><h3 style="margin:0">Playtest Diagnostics</h3><div class="small muted">Optional trace and session export. Does not affect resolution.</div></div><button class="btn ${game.diagnosticsEnabled?"good":""}" onclick="setDiagnosticsEnabled(!game.diagnosticsEnabled)">${game.diagnosticsEnabled?"Enabled":"Enable"}</button></div>${game.diagnosticsEnabled?`<div class="divider"></div><div class="row"><span class="small">${diagnosticsSummary().eventCount} trace events · session ${esc(diagnosticsSummary().sessionId)}</span><button class="btn" onclick="exportDiagnostics()">Export diagnostics JSON</button></div>`:""}</div><h3>Ledger</h3><div class="card">${game.ledger.slice().reverse().slice(0,30).map(x=>`<div class="row small"><span>Day ${x.day} · ${esc(x.description)}</span><b class="money ${x.amount>=0?"pos":"neg"}">${money(x.amount)}</b></div>`).join("")}</div>`}

function confirmFire(id){const m=merc(id);if(!m)return;document.getElementById("modalTitle").textContent=`Dismiss ${m.name}?`;document.getElementById("modalBody").innerHTML=`<div class="notice warn"><b>This permanently removes ${esc(m.name)} from the active roster.</b><br><span class="small">Future payroll falls by ${money(m.payroll)}. Career History is preserved in the former-mercenary archive. No recruit appears automatically.</span></div><div class="row" style="margin-top:12px"><button class="btn" onclick="showMerc('${m.id}')">Cancel</button><button class="btn bad" onclick="fireMercenary('${m.id}')">Confirm Firing</button></div>`}
function causalityHtml(r){const c=r.outcomeCausality;if(!c||r.outcome==="success")return "";return `<h4>Why this ${r.outcome==="withdrawal"?"ended in withdrawal":"mission failed"}</h4><div class="notice ${r.outcome==="failure"?"bad":"warn"}"><b>${esc(c.primaryCause)}</b><div class="small" style="margin-top:5px">${esc(c.summary)}</div><div class="divider"></div><div class="small"><b>Proximal trigger:</b> ${esc(c.proximalTrigger||"Not recorded")}</div>${c.contributors?.length?`<div class="small" style="margin-top:6px"><b>Contributing factors</b>${c.contributors.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${c.levers?.length?`<div class="small" style="margin-top:6px"><b>What could have changed the outcome?</b>${c.levers.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}</div>`}
function eventNarrativeHtml(e){const n=e.narrative;if(!n)return e.context?`<div class="small">${esc(e.context)}</div>`:"";return `<div class="small" style="margin:6px 0"><div>${esc(n.situation)}</div><div>${esc(n.action)}</div><div><b>${esc(n.result)}</b> ${esc(n.consequence)}</div></div>`}


document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importSave(e.target.files[0])});
game=normalizeGameState(game);
bootstrap();
telemetryInit();
window.__MCS_TEST__={
  snapshot:()=>deep(game),
  diagnostics:()=>diagnosticsExportObject(),
  reset:()=>{game=normalizeGameState(deep(INITIAL_STATE));bootstrap();telemetryInit();currentTab="dashboard";selectedJobId=null;selectedParty=[];selectedLeader="";selectedRoles={scout:"",medic:"",quartermaster:""};render();return deep(game)},
  advance:()=>{advance();return deep(game)},
  build:BUILD_INFO
};
render();

</script>
</body>
</html>

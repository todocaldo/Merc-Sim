<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercenary Company Manager — Playable Base v0.2.0</title>
<style>
:root{--bg:#0e1012;--panel:#171a1e;--panel2:#1d2126;--line:#30363d;--text:#eceff2;--muted:#9ca6b1;--accent:#d6b06a;--good:#7bbf85;--warn:#d1a85c;--bad:#d27575;--blue:#7fa9d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(14,16,18,.96);border-bottom:1px solid var(--line);padding:12px 14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:800;font-size:17px}.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px}
nav{display:flex;gap:6px;overflow:auto;padding-top:10px}nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:9px}
nav button.active{border-color:var(--accent);color:var(--accent)}
main{padding:14px 14px 100px}.grid{display:grid;gap:12px}.grid2{grid-template-columns:1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}
.card h3,.card h4{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 11px;cursor:pointer}.btn:hover{border-color:#59626d}.btn.primary{background:#3a3020;border-color:#7a6236;color:#f6dfb4}.btn.good{border-color:#42694a}.btn.bad{border-color:#754646}.btn:disabled{opacity:.4;cursor:not-allowed}
.stat{font-size:23px;font-weight:800}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.divider{height:1px;background:var(--line);margin:10px 0}
.job{border-left:4px solid var(--blue)}.job.selected{border-left-color:var(--accent)}.goodline{border-left:4px solid var(--good)}.warnline{border-left:4px solid var(--warn)}.badline{border-left:4px solid var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:5px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:#c7ced6}
.skillgrid{display:grid;grid-template-columns:1fr 44px;gap:4px 10px}.skillgrid div:nth-child(even){text-align:right}.bar{height:5px;background:#2a2f35;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#7f8995}
input[type=checkbox],input[type=radio]{accent-color:#c8a763}.member{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #252a30}.member:last-child{border-bottom:0}
select{background:#111418;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.coverage .ao{border-top:1px solid var(--line);padding:7px 0}.coverage .ao:first-child{border-top:0}
.notice{padding:9px;border-radius:9px;background:#1e2227;border:1px solid var(--line)}.notice.warn{border-color:#725f36}.notice.bad{border-color:#704343}.notice.good{border-color:#3f6546}
.report-event{border-left:2px solid #4d5660;padding-left:9px;margin:7px 0}.money.pos{color:var(--good)}.money.neg{color:var(--bad)}
dialog{width:min(720px,94vw);max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0}dialog::backdrop{background:#000b}.dlghead{position:sticky;top:0;background:var(--panel);padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.dlgbody{padding:13px}
footer{position:fixed;bottom:0;left:0;right:0;background:#101214;border-top:1px solid var(--line);padding:9px;z-index:30}.footerinner{max-width:1072px;margin:auto;display:flex;gap:8px}.footerinner .btn{flex:1}

.map-shell{position:relative;background:#111418;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:520px}
.world-map{display:block;width:100%;height:auto;min-height:520px;touch-action:manipulation;background:linear-gradient(180deg,#15191d,#101316)}
.map-route{stroke:#46505a;stroke-width:1.7;fill:none;opacity:.9}.map-route.blocked{stroke:#7a4a4a;stroke-dasharray:5 4}
.map-region-label{fill:#7f8994;font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.42;pointer-events:none}
.map-node{cursor:pointer}.map-node .node-ring{fill:#171a1e;stroke:#8e98a3;stroke-width:2}.map-node.major .node-ring{stroke-width:3}.map-node.base .node-ring{stroke:var(--accent);stroke-width:4}.map-node.selected .node-ring{stroke:#f0d79e;stroke-width:4}.map-node text{fill:var(--text);font-size:12px;font-weight:700;paint-order:stroke;stroke:#0e1012;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.map-node .job-count{fill:var(--accent);stroke:#0e1012;stroke-width:2}.map-node .job-count-text{fill:#101214;stroke:none;font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:central}.map-control{stroke-width:3;fill:#171a1e}.map-expedition{cursor:pointer}.map-expedition circle{fill:#e4c27f;stroke:#101214;stroke-width:3}.map-expedition text{fill:#101214;font-size:9px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.map-expedition.selected circle{stroke:#fff0c8;stroke-width:4}
.map-legend{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%;pointer-events:none}.map-legend .pill{background:rgba(17,20,24,.88)}
.map-sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:45%;overflow:auto;background:rgba(23,26,30,.97);border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 -8px 30px #0008}.map-sheet .closex{float:right}.map-kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.map-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.map-empty{position:absolute;right:10px;top:10px;background:rgba(17,20,24,.9);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11px;color:var(--muted)}
@media(max-width:600px){.map-shell,.world-map{min-height:600px}.map-region-label{font-size:15px}.map-node text{font-size:11px}.map-sheet{max-height:52%}}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}main{padding-bottom:80px}.desktop2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}}
</style>

function applicationProfile(m,skill,application,dependence,difficulty){

 const penalties={Low:{Specialized:0,Familiar:0,Unfamiliar:.5,none:.75},Moderate:{Specialized:0,Familiar:0,Unfamiliar:1.5,none:2},High:{Specialized:0,Familiar:0,Unfamiliar:2.5,none:3.5}};
 if(exp==="Specialized" && dependence==="Moderate")eff=Math.max(eff,6);

 return {effective:eff,difficulty:difficulty+mod,baseDifficulty:difficulty,experience:exp,modifier:mod};
}

function personnelSensitivity(ao){

 let min=2;

}

}

function routePointForAction(exp,action,indexProgress=1){
 if(!action||action.kind!=="travel")return null;
 let before=0;for(let i=0;i<(exp.travelActionIndex||0);i++){const a=exp.travelSchedule?.actions?.[i];if(a?.kind==="travel"&&a.routeId===action.routeId&&a.fromLocationId===action.fromLocationId&&a.toLocationId===action.toLocationId)before+=a.hours||0}
 const full=Math.max(0.001,Number(action.fullLegHours||action.hours||1)),ratio=Math.max(0,Math.min(1,(before+(action.hours||0)*indexProgress)/full));const a=mapXY(game.worldState.locations[action.fromLocationId]),b=mapXY(game.worldState.locations[action.toLocationId]);return {x:a.x+(b.x-a.x)*ratio,y:a.y+(b.y-a.y)*ratio,ratio};
}
function expeditionMapPoint(exp){
 if(exp.phase==="on_site")return mapXY(game.worldState.locations[exp.destinationLocationId]);
 if(exp.phase==="outbound"||exp.phase==="returning"){
  const a=exp.currentTravelAction;if(a?.kind==="travel"){const start=(exp.nextTransitionHour??game.campaignHour)-(a.hours||0),prog=Math.max(0,Math.min(1,(game.campaignHour-start)/Math.max(0.001,a.hours||1)));return routePointForAction(exp,a,prog)}
 }
 if(exp.phase==="encamped"){
  const actions=exp.travelSchedule?.actions||[];for(let i=(exp.travelActionIndex||0)-1;i>=0;i--){if(actions[i]?.kind==="travel"){const saved=exp.travelActionIndex;const old=exp.travelActionIndex;exp.travelActionIndex=i;const pt=routePointForAction(exp,actions[i],1);exp.travelActionIndex=old;return pt}}
 }
 return mapXY(game.worldState.locations[exp.currentLocationId||exp.originLocationId||game.worldState.companyBaseLocationId]);
}

 <h4>Aptitudes</h4><div class="skillgrid">${Object.entries(m.aptitudes).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Learned Skills</h4><div class="skillgrid">${Object.entries(m.skills).map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>
 <h4>Applications</h4><div class="pills">${Object.entries(m.applications||{}).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("")||"None"}</div>
 <h4>Recent Career History</h4>${m.careerHistory.slice(-10).reverse().map(h=>`<div class="small report-event">Day ${h.day} · ${esc(h.type)} ${h.skill?`· ${esc(h.skill)}`:""} ${h.evidenceKind?`· ${esc(h.evidenceKind)}`:""} ${h.result?`· ${esc(h.result)}`:""}</div>`).join("")||`<div class="muted small">No events yet.</div>`}
 <div class="divider"></div><button class="btn bad" style="width:100%" ${available(m)&&game.roster.length>1?"":"disabled"} onclick="confirmFire('${m.id}')">Fire Mercenary</button>${!available(m)?`<div class="tiny muted" style="margin-top:5px">Mercenaries can only be dismissed while physically available to the company.</div>`:""}`;modal.showModal()
}
function recruitView(){const until=game.nextRecruitDay-game.day;return `<div class="row"><div><h2 style="margin:0">Recruitment</h2><div class="small muted">Next market arrival approximately Day ${game.nextRecruitDay} (${Math.max(0,until)} days). Hiring does not trigger replacement.</div></div></div><div class="grid grid2" style="margin-top:10px">${game.recruits.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="small muted">Age ${c.age} · ${c.careerStage} · leaves after Day ${c.expiresDay}</div></div><div style="text-align:right"><b>${money(c.hireCost)}</b><div class="tiny muted">${money(c.payroll)}/payroll</div></div></div><div class="small">${topSkills(c,5)}</div><button class="btn" style="margin-top:8px" onclick="hire('${c.id}')">Hire</button></div>`).join("")||`<div class="card muted">No candidates are currently available. The market will refill on its own schedule.</div>`}</div>`}
function reportsView(){return `<h2>Post-Job Reports</h2><div class="stack">${game.reports.map((r,i)=>`<div class="card ${r.outcome==="success"?"goodline":"warnline"}"><div class="row"><div><b>${esc(r.title)}</b><div class="small muted">Day ${r.day} · ${r.outcome.toUpperCase()}</div></div><b>${money(r.reward+r.bonus)}</b></div><div class="small">${r.party.join(", ")}</div><button class="btn" style="margin-top:7px" onclick="showReport(${i})">Open report</button></div>`).join("")||`<div class="card muted">No completed Jobs yet.</div>`}</div>`}
function fmt3(n){return Number(n??0).toFixed(2)}
function capabilityLabel(a){return a.aptitude?`Aptitude ${a.aptitude}`:a.application?`${a.skill} + ${a.application}${a.applicationExperience&&a.applicationExperience!=="none"?` (${a.applicationExperience})`:""}`:(a.skill||"Unknown")}
function selectionMathHtml(a){
 const m=a.selectionMath||{};
 const fallback=a.fallbackPenalty?` − ${fmt3(a.fallbackPenalty)} fallback`:"";
 return `<div class="tiny muted">Selection score: ${fmt3(m.capabilityMargin)} capability margin − ${fmt3(m.riskPenalty)} risk − ${fmt3(m.detectionPenalty)} detection − ${fmt3(m.timePenalty)} time − ${fmt3(m.resourcePenalty)} resources${fallback} = <b>${fmt3(a.selectionScore)}</b></div>`;
}
function availableApproachesHtml(e){
 const rows=e.availableApproaches||[];
 if(!rows.length)return `<div class="tiny muted">Approach audit was not recorded in this older report.</div>`;
 return `<details style="margin-top:8px"><summary class="small"><b>Available approaches (${rows.length})</b></summary><div style="margin-top:6px">${rows.map(a=>`<div class="card" style="padding:8px;margin:6px 0;background:#121519"><div class="row"><div><b>${a.chosen?"✓ ":""}${esc(a.mechanism)}</b>${a.chosen?` <span class="pill">CHOSEN</span>`:""}</div><span class="pill">${a.credible?"Credible":"Fallback"}</span></div><div class="tiny">Best actor: <b>${esc(a.bestActorName)}</b> · ${esc(capabilityLabel(a))}</div><div class="tiny muted">Capability ${fmt3(a.effective)} · base difficulty ${fmt3(a.baseDifficulty)}${a.applicationModifier?` + app modifier ${fmt3(a.applicationModifier)}`:""} = adjusted difficulty ${fmt3(a.adjustedDifficulty)}</div><div class="tiny muted">Risk ${a.casualty} · detection ${a.detection} · ${fmt3(a.timeHours)}h · ${money(a.resource)}</div>${selectionMathHtml(a)}${!a.considered?`<div class="tiny muted">Not considered for selection because at least one credible method existed.</div>`:""}</div>`).join("")}</div></details>`;
}
function resultMathHtml(e){
 const m=e.resultMath||{effective:e.effective,varianceRoll:e.varianceRoll,adjustedDifficulty:e.difficulty,margin:e.margin};
 if(m.varianceRoll===undefined||m.varianceRoll===null)return `<div class="tiny muted">Legacy report: deterministic variance roll was not recorded.</div>`;
 return `<div class="notice" style="margin-top:7px"><b class="small">Resolution math</b><div class="small"><b>${fmt3(m.effective)}</b> effective capability + <b>${Number(m.varianceRoll)>=0?"+":""}${fmt3(m.varianceRoll)}</b> variance − <b>${fmt3(m.adjustedDifficulty)}</b> adjusted difficulty = <b>${Number(m.margin)>=0?"+":""}${fmt3(m.margin)}</b> margin → ${e.result.toUpperCase()}</div><div class="tiny muted">Strong ≥ +2 · Solid ≥ 0 · Mixed ≥ −2 · Poor &lt; −2</div></div>`;
}
function showReport(i){
 const r=game.reports[i];logDiag("report_opened",{reportId:r.id,jobTitle:r.title,outcome:r.outcome});const identity=r.identity?`<div class="notice" style="margin-top:8px"><b>${esc(r.identity.employer.name)}</b> · ${esc(r.identity.employer.faction)}<br><span class="small">${esc(r.identity.location.name)}, ${esc(r.identity.location.region)} · Target: ${esc(r.identity.target)}</span></div>`:"",roles=r.roles?`<div class="small muted">Roles: Scout ${r.roles.scout||"Unassigned"} · Medic ${r.roles.medic||"Unassigned"} · Quartermaster ${r.roles.quartermaster||"Unassigned"}</div>`:"";
 document.getElementById("modalTitle").textContent=r.title;document.getElementById("modalBody").innerHTML=`<div class="row"><b>${r.outcome.toUpperCase()}</b><b>${money(r.reward+r.bonus)}</b></div><div class="small muted">Leader ${r.leader} · ${r.party.join(", ")}</div>${roles}${identity}${understrengthSuccessHtml(r)}${causalityHtml(r)}
 <h4>Operational narrative</h4>${r.events.map((e,idx)=>`<div class="report-event"><div class="row"><b>${idx+1}. ${e.operation} · ${e.primitive}</b><span class="pill">${e.result.toUpperCase()}</span></div>${eventNarrativeHtml(e)}<div class="tiny muted">${e.skill?e.application?`${e.skill} + ${e.application}`:e.skill:`Aptitude ${e.aptitude}`} · casualty ${e.casualty} · detection ${e.detection}${e.evidenceKind?` · ${e.evidenceKind}`:""}</div>${resultMathHtml(e)}${availableApproachesHtml(e)}</div>`).join("")}
 <h4>Injuries</h4>${injuryCausalityHtml(r)}<h4>Career moments</h4>${r.stretchMoments?.length?r.stretchMoments.map(x=>`<div class="notice"><b>${esc(x.actorName)} — Stretch</b><div class="small">${esc(x.skill)}${x.application?` / ${esc(x.application)}`:""} · ${esc(x.approach.replaceAll("_"," "))} · ${esc(x.result)} · career Stretch #${x.careerStretchActions}</div></div>`).join(""):`<div class="small muted">No Stretch actions recorded on this Job.</div>`}<h4>Development</h4>${r.devNotes.map(x=>`<div>${x}</div>`).join("")||`<div class="small muted">Evidence recorded; no Skill realization this Job.</div>`}`;modal.showModal()
}
function systemView(){return `<div class="grid grid2"><div class="card stack"><h3>Save / Load</h3><button class="btn primary" onclick="save()">Save to browser</button><button class="btn" onclick="load()">Load browser save</button><button class="btn" onclick="exportSave()">Export save JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import save JSON</button><button class="btn bad" onclick="resetGame()">New company</button></div><div class="card"><h3>Build scope</h3><div class="small muted">Playable Base v0.2.0: strategic world state, route travel and road camps, Personnel Sufficiency, dynamic Job market, and Tier-1 rival companies are active.</div><div class="divider"></div><div class="small">Strategic Map UI, tighter opening economy, Outcome Explanation v0.2, Injury Causality, understrength-success reporting, and Skill taxonomy/travel diagnostics are active.</div></div></div><div class="card" style="margin-top:12px"><div class="row"><div><h3 style="margin:0">Playtest Diagnostics</h3><div class="small muted">Optional trace and session export. Does not affect resolution.</div></div><button class="btn ${game.diagnosticsEnabled?"good":""}" onclick="setDiagnosticsEnabled(!game.diagnosticsEnabled)">${game.diagnosticsEnabled?"Enabled":"Enable"}</button></div>${game.diagnosticsEnabled?`<div class="divider"></div><div class="row"><span class="small">${diagnosticsSummary().eventCount} trace events · session ${esc(diagnosticsSummary().sessionId)}</span><button class="btn" onclick="exportDiagnostics()">Export diagnostics JSON</button></div>`:""}</div><h3>Ledger</h3><div class="card">${game.ledger.slice().reverse().slice(0,30).map(x=>`<div class="row small"><span>Day ${x.day} · ${esc(x.description)}</span><b class="money ${x.amount>=0?"pos":"neg"}">${money(x.amount)}</b></div>`).join("")}</div>`}

function confirmFire(id){const m=merc(id);if(!m)return;document.getElementById("modalTitle").textContent=`Dismiss ${m.name}?`;document.getElementById("modalBody").innerHTML=`<div class="notice warn"><b>This permanently removes ${esc(m.name)} from the active roster.</b><br><span class="small">Future payroll falls by ${money(m.payroll)}. Career History is preserved in the former-mercenary archive. No recruit appears automatically.</span></div><div class="row" style="margin-top:12px"><button class="btn" onclick="showMerc('${m.id}')">Cancel</button><button class="btn bad" onclick="fireMercenary('${m.id}')">Confirm Firing</button></div>`}
function causalityHtml(r){const c=r.outcomeCausality;if(!c)return "";const success=r.outcome==="success",title=success?"Why this mission succeeded":r.outcome==="withdrawal"?"Why this ended in withdrawal":"Why this mission failed";return `<h4>${title}</h4><div class="notice ${r.outcome==="failure"?"bad":r.outcome==="withdrawal"?"warn":"good"}"><b>${esc(c.primaryCause)}</b><div class="small" style="margin-top:5px">${esc(c.summary)}</div>${c.completionRequirement!=null?`<div class="small" style="margin-top:6px"><b>Completion:</b> ${fmt3(c.accumulatedProgress)} progress vs ${fmt3(c.completionRequirement)} required</div>`:""}${success&&c.decisiveContributions?.length?`<div class="small" style="margin-top:6px"><b>Decisive contributions</b>${c.decisiveContributions.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${success&&c.unresolvedSetbacks?.length?`<div class="small" style="margin-top:6px"><b>Unresolved pressure</b>${c.unresolvedSetbacks.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${!success?`<div class="divider"></div><div class="small"><b>Proximal trigger:</b> ${esc(c.proximalTrigger||"Not recorded")}</div>`:""}${!success&&c.contributors?.length?`<div class="small" style="margin-top:6px"><b>Contributing factors</b>${c.contributors.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${c.levers?.length?`<div class="small" style="margin-top:6px"><b>What could have changed the outcome?</b>${c.levers.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}</div>`}
function understrengthSuccessHtml(r){const u=r.understrengthSuccess;if(!u)return "";return `<div class="notice warn" style="margin-top:8px"><b>${esc(u.label)} — ${esc(u.band)}</b><div class="small">The expedition completed the contract with ${u.actual} mercenaries${u.recommended?` against a recommended party of ${esc(String(u.recommended))}`:""}. ${esc(u.summary||"")}</div><div class="tiny muted">Peak operational commitments ${u.maxOperationalCommitments??0} · sustainment burden ${fmt3(u.sustainmentBurden||0)}</div></div>`}
function injuryCausalityHtml(r){if(!r.injuries?.length)return `<div class="small muted">None</div>`;return r.injuries.map(x=>{const primary=x.primaryActorName&&x.primaryActorName!==x.actorName?` while supporting ${esc(x.primaryActorName)}'s ${esc(mechanismPhrase(x.approach||"operation"))}`:` during ${esc(mechanismPhrase(x.approach||"the operation"))}`;const ctx=x.operation&&x.primitive?`${esc(x.operation)} / ${esc(x.primitive)}`:"operational activity";return `<div class="notice warn" style="margin:6px 0"><b>${esc(x.actorName)} — ${esc(x.severity)} injury</b><div class="small">Wounded${primary}. Cause: ${ctx}; casualty exposure ${esc(x.casualtyExposure||"unknown")}${x.result?` with a ${esc(String(x.result).toUpperCase())} resolution`:""}.</div>${x.context?`<div class="tiny muted">Context: ${esc(x.context)}</div>`:""}</div>`}).join("")}
function eventNarrativeHtml(e){const n=e.narrative;if(!n)return e.context?`<div class="small">${esc(e.context)}</div>`:"";return `<div class="small" style="margin:6px 0"><div>${esc(n.situation)}</div><div>${esc(n.action)}</div><div><b>${esc(n.result)}</b> ${esc(n.consequence)}</div></div>`}


document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importSave(e.target.files[0])});
game=normalizeGameState(game);
bootstrap();
telemetryInit();
window.__MCS_TEST__={
  snapshot:()=>deep(game),
  diagnostics:()=>diagnosticsExportObject(),
  reset:()=>{game=normalizeGameState(deep(INITIAL_STATE));bootstrap();telemetryInit();currentTab="dashboard";selectedJobId=null;selectedParty=[];selectedLeader="";selectedRoles={scout:"",medic:"",quartermaster:""};render();return deep(game)},
  advance:()=>{advance();return deep(game)},
  rivals:()=>deep(game.rivalCompanies),worldHistory:()=>deep(game.worldState.history),build:BUILD_INFO
};
render();


</script>
</body>
</html>

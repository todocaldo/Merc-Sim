function filteredRosterForCompare(){const stageOrder={Emerging:1,Developing:2,Established:3,Veteran:4},fitOrder={Poor:1,Adequate:2,Strong:3};let xs=game.roster.filter(m=>{const isAvail=available(m),state=rosterOperationalState(m);if(rosterCompare.availability==="available"&&!isAvail)return false;if(rosterCompare.availability==="unavailable"&&isAvail)return false;if(rosterCompare.state!=="all"&&state!==rosterCompare.state)return false;if(rosterCompare.careerStage!=="all"&&m.careerStage!==rosterCompare.careerStage)return false;if(rosterCompare.skill!=="all"&&(m.skills?.[rosterCompare.skill]||0)<Number(rosterCompare.skillMin||0))return false;if(rosterCompare.role!=="all"&&fitOrder[comparisonRoleSuitability(m,rosterCompare.role).label]<fitOrder[rosterCompare.roleMin])return false;return true});const dir=rosterCompare.sortDir,key=rosterCompare.sortKey;xs.sort((a,b)=>{let av=rosterCompareValue(a,key),bv=rosterCompareValue(b,key);if(key==="meta:career"){av=stageOrder[av]||0;bv=stageOrder[bv]||0}if(typeof av==="string"||typeof bv==="string")return String(av).localeCompare(String(bv))*dir||a.name.localeCompare(b.name);return ((av-bv)*dir)||a.name.localeCompare(b.name)});return xs}

ass="small muted">Skill threshold<select onchange="setRosterCompareFilter('skill',this.value)"><option value="all">Any Skill</option>${skillNames.map(v=>`<option value="${esc(v)}" ${rosterCompare.skill===v?"selected":""}>${esc(v)}</option>`).join("")}</select><input type="number" min="0" max="10" value="${Number(rosterCompare.skillMin||0)}" aria-label="Minimum skill" ${rosterCompare.skill==="all"?"disabled":""} onchange="setRosterCompareFilter('skillMin',this.value)"></label><label class="small muted">Role suitability<select onchange="setRosterCompareFilter('role',this.value)"><option value="all">Any role</option>${roleNames.map(([v,l])=>`<option value="${v}" ${rosterCompare.role===v?"selected":""}>${l}</option>`).join("")}</select></label><label class="small muted">Minimum fit<select ${rosterCompare.role==="all"?"disabled":""} onchange="setRosterCompareFilter('roleMin',this.value)">${["Poor","Adequate","Strong"].map(v=>`<option value="${v}" ${rosterCompare.roleMin===v?"selected":""}>${v}</option>`).join("")}</select></label></div><div class="divider"></div><details><summary class="small"><b>Choose comparison columns</b> <span class="column-count ${rosterCompare.columns.length>=3&&rosterCompare.columns.length<=5?"good":"bad"}">${rosterCompare.columns.length}/5</span></summary><div class="roster-column-picker" style="margin-top:8px">${ROSTER_COMPARE_COLUMNS.map(c=>`<label><input type="checkbox" ${rosterCompare.columns.includes(c.key)?"checked":""} onchange="toggleRosterCompareColumn('${esc(c.key)}',this.checked)">${esc(c.label)}</label>`).join("")}</div></details></div>${rosterComparisonTable()}`}

function relationStandingLabel(v){return String(v||"unknown").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}

const RELATIONSHIP_DERIVATION_VERSION="0.1";
function playerFactionEvidence(f){return (f?.strategicOutcomeEvidence||[]).filter(e=>e.actorType==="player_company")}
function relationEvidenceWeight(e){const roles=new Set(e?.roles||[]),base=e?.outcome==="success"?1:e?.outcome==="failure"?-1:0;return base*((roles.has("employer")?2:0)+(roles.has("location_controller")?1:0)||1)}
function deriveFactionRelationship(f){
 const ev=playerFactionEvidence(f),weighted=ev.map(e=>({...e,weight:relationEvidenceWeight(e)})),score=weighted.reduce((a,e)=>a+e.weight,0),positive=weighted.filter(e=>e.weight>0),negative=weighted.filter(e=>e.weight<0),employerSuccesses=weighted.filter(e=>e.outcome==="success"&&(e.roles||[]).includes("employer")).length;
 let standing="neutral";if(negative.length>=3&&score<=-4)standing="distrustful";else if(score<0)standing="wary";else if(employerSuccesses>=4&&negative.length===0&&score>=8)standing="trusted";else if(score>=2)standing="favorable";
 const recent=weighted.slice(-3),recentBalance=recent.reduce((a,e)=>a+e.weight,0),trend=recentBalance>0?"improving":recentBalance<0?"worsening":"stable";
 return {version:RELATIONSHIP_DERIVATION_VERSION,standing,trend,positiveCount:positive.length,negativeCount:negative.length,completedCount:ev.length,employerSuccesses,score};
}
function deriveEmployerRelationship(e){
 const hist=(e?.contractHistory||[]).filter(x=>x.actorType==="player_company"),successes=hist.filter(x=>x.outcome==="success").length,failures=hist.filter(x=>x.outcome==="failure").length,withdrawals=hist.filter(x=>x.outcome==="withdrawal").length,completed=hist.length;
 const familiarity=completed===0?"unknown":completed===1?"known":completed<=3?"familiar":"established";
 let trust="neutral";if(failures>=3&&successes===0)trust="distrustful";else if(failures>successes)trust="wary";else if(successes>=4&&failures===0)trust="trusted";else if(successes>failures)trust="favorable";
 const recent=hist.slice(-3),recentBalance=recent.reduce((a,x)=>a+(x.outcome==="success"?1:x.outcome==="failure"?-1:0),0),trend=recentBalance>0?"improving":recentBalance<0?"worsening":"stable";
 return {version:RELATIONSHIP_DERIVATION_VERSION,familiarity,trust,trend,completed,successes,failures,withdrawals};
}
function refreshRelationshipDerivations(){
 const ws=game?.worldState;if(!ws)return;for(const f of Object.values(ws.factions||{})){const d=deriveFactionRelationship(f);f.companyRelationship=f.companyRelationship||{};f.companyRelationship.standing=d.standing;f.companyRelationship.derivation=d;f.companyRelationship.trustEvidence=playerFactionEvidence(f).filter(e=>relationEvidenceWeight(e)>0).map(e=>e.eventId);f.companyRelationship.hostilityEvidence=playerFactionEvidence(f).filter(e=>relationEvidenceWeight(e)<0).map(e=>e.eventId)}
 for(const e of Object.values(ws.employers||{})){const d=deriveEmployerRelationship(e);e.relationship=e.relationship||{};e.relationship.familiarity=d.familiarity;e.relationship.trust=d.trust;e.relationship.derivation=d}
}
function relationFactionPlayerEvidence(f){return (f?.strategicOutcomeEvidence||[]).filter(e=>e.actorType==="player_company").map(e=>{const ev=game.worldState.history.find(x=>x.id===e.eventId);return {...e,event:ev}}).sort((a,b)=>(b.event?.campaignHour??0)-(a.event?.campaignHour??0))}
function relationEmployerPlayerHistory(e){return (e?.contractHistory||[]).filter(x=>x.actorType==="player_company").slice().sort((a,b)=>(b.day||0)-(a.day||0))}
function relationActiveSituationsForFaction(fid){return Object.values(game.worldState.situations||{}).filter(s=>s.lifecycleState!=="Resolved"&&(s.affectedLocationIds||[]).some(lid=>game.worldState.locations[lid]?.controllerFactionId===fid))}
function relationOpenJobsForFaction(fid){return game.offers.filter(j=>{const emp=game.worldState.employers[j.identity?.employer?.id];return (j.identity?.employer?.factionId||emp?.factionId||emp?.alignedFactionId||null)===fid})}
function relationRecentEventHtml(e){const ev=e.event;if(!ev)return "";const job=ev.jobTitle||"Contract outcome",out=relationOutcomeLabel(e.outcome),role=(e.roles||[]).map(relationStandingLabel).join(", ");return `<div class="relation-event small"><b>Day ${ev.day||Math.floor((ev.campaignHour||0)/24)+1} · ${esc(job)}</b><br><span class="muted">${esc(out)}${role?` · ${esc(role)}`:""}</span>${ev.summary?`<br>${esc(ev.summary)}`:""}</div>`}
function relationEmployerHtml(e){const hist=relationEmployerPlayerHistory(e),loc=game.worldState.locations[e.homeLocationId],fac=game.worldState.factions[e.factionId],d=deriveEmployerRelationship(e);return `<div class="relation-employer"><div class="row wrap"><div><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.title||e.employerType||"Employer")}${loc?` · ${esc(loc.name)}`:""}</div></div><div class="relation-links"><span class="pill">Familiarity: ${esc(relationStandingLabel(d.familiarity))}</span><span class="pill">Trust: ${esc(relationStandingLabel(d.trust))}</span><span class="pill">Trend: ${esc(relationStandingLabel(d.trend))}</span></div></div><div class="tiny muted" style="margin-top:4px">${hist.length?`${hist.length} completed player contract${hist.length===1?"":"s"} · ${d.successes} success · ${d.failures} failure · ${d.withdrawals} withdrawal`:"No completed player contracts recorded"}${fac?` · ${esc(fac.name)}`:""}</div></div>`}
function relationFactionCard(f){const evidence=relationFactionPlayerEvidence(f),locs=(f.controlledLocationIds||[]).map(id=>game.worldState.locations[id]).filter(Boolean),emps=(f.knownEmployerIds||[]).map(id=>game.worldState.employers[id]).filter(Boolean),jobs=relationOpenJobsForFaction(f.id),situations=relationActiveSituationsForFaction(f.id),d=deriveFactionRelationship(f);return `<section class="card relation-card"><div class="relation-head"><div><div class="label">${esc(relationStandingLabel(f.factionType))}</div><h3 style="margin:3px 0">${esc(f.name)}</h3><div class="small muted">${esc(f.description||"")}</div></div><span class="badge relation-status">${esc(relationStandingLabel(d.standing))}</span></div><div class="relation-links" style="margin-top:7px"><span class="pill">Trend: ${esc(relationStandingLabel(d.trend))}</span><span class="pill">${d.positiveCount} positive evidence</span><span class="pill">${d.negativeCount} negative evidence</span></div><div class="tiny muted" style="margin-top:5px">Standing is derived from meaningful player-company outcomes. Employer-side results carry more relationship weight than incidental location-control involvement; withdrawals add history but are not automatically negative.</div><div class="divider"></div><div class="relation-section-title">Current relevance</div><div class="relation-links" style="margin-top:5px"><span class="pill">${jobs.length} open Job${jobs.length===1?"":"s"}</span><span class="pill">${situations.length} active Situation${situations.length===1?"":"s"}</span><span class="pill">${locs.length} controlled Location${locs.length===1?"":"s"}</span></div>${f.themes?.length?`<div class="relation-section-title">Known interests</div><div class="relation-links" style="margin-top:5px">${f.themes.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`:""}<div class="relation-section-title">Player history</div>${evidence.length?`<div class="relation-history">${evidence.slice(0,4).map(relationRecentEventHtml).join("")}</div>`:`<div class="small muted" style="margin-top:5px">No meaningful player contract outcomes recorded with this faction yet.</div>`}${emps.length?`<details style="margin-top:10px"><summary class="small"><b>Known employers (${emps.length})</b></summary><div style="margin-top:5px">${emps.map(relationEmployerHtml).join("")}</div></details>`:""}${locs.length?`<details style="margin-top:8px"><summary class="small"><b>Controlled locations (${locs.length})</b></summary><div class="small muted" style="margin-top:5px">${locs.map(l=>esc(l.name)).join(" · ")}</div></details>`:""}</section>`}
function relationsView(){refreshRelationshipDerivations();const fs=Object.values(game.worldState?.factions||{}).sort((a,b)=>a.name.localeCompare(b.name)),unaffiliated=Object.values(game.worldState?.employers||{}).filter(e=>!e.factionId);return `<div class="row wrap"><div><h2 style="margin:0">Relations</h2><div class="small muted">Evidence-based faction standing, employer familiarity/trust, meaningful player history, and current world relevance.</div></div><span class="badge">Derived from history · no faction XP</span></div><div class="notice" style="margin-top:10px"><b>Relationship Derivation v0.1</b><br><span class="small">Successes and failures create standing evidence. Withdrawals count as history but are not automatically negative. Trusted requires repeated successful employer-side work. Ordinary contract failure alone cannot make a faction Hostile.</span></div><div class="relations-grid">${fs.map(relationFactionCard).join("")}</div>${unaffiliated.length?`<h3 style="margin-top:14px">Independent / unaffiliated employers</h3><div class="card">${unaffiliated.map(relationEmployerHtml).join("")}</div>`:""}`}

function helpView(){const def=(term,copy)=>`<div class="help-def"><div class="help-term">${esc(term)}</div><div class="small">${copy}</div></div>`;return `<div class="row wrap"><div><h2 style="margin:0">Help & Game Reference</h2><div class="small muted">Persistent reference for the management loop, tabs, and core terminology. Help explains decisions; it does not make them for you.</div></div><span class="badge">v0.2.3</span></div><div class="help-jump" style="margin-top:10px"><button class="btn" onclick="document.getElementById('help-start').scrollIntoView()">Getting Started</button><button class="btn" onclick="document.getElementById('help-tabs').scrollIntoView()">Tabs</button><button class="btn" onclick="document.getElementById('help-exp').scrollIntoView()">Expeditions</button><button class="btn" onclick="document.getElementById('help-defs').scrollIntoView()">Definitions</button></div><div class="help-grid" style="margin-top:10px"><section class="card help-section" id="help-start"><h3>Getting Started</h3><div class="small">You run a mercenary company. The core loop is <b>evaluate Jobs → choose who to send → assign responsibilities → let the expedition resolve → read what happened → manage the changed roster and world</b>.</div><div class="divider"></div><div class="small"><b>Your main player skill is roster knowledge.</b> There is rarely one correct expedition. Compare relevant Skills, Applications, readiness, role suitability, current availability, and what capability you want to commit or develop.</div></section><section class="card help-section" id="help-tabs"><h3>What each tab does</h3>${def("Company","Your current company state: money, roster availability, active expeditions, payroll pressure, and recent high-level status.")}${def("Map","The strategic world. Inspect Locations, routes, active Situations, expedition travel, and Recent Notices.")}${def("Job Board","Open contracts created by world Situations. Read Why now / If successful / If unresolved, then choose which problems your company will address.")}${def("Roster","Compare mercenaries. Use presets, filters, sortable columns, readiness/injury status, role suitability, and detailed profiles to learn who is on the roster.")}${def("Recruitment","Evaluate available candidates and decide whether additional capability is worth the hiring and payroll cost.")}${def("Relations","Inspect evidence-based faction standing, employer familiarity/trust, meaningful contract history, controlled locations, and current world relevance. Standing is derived from actual player-company outcomes rather than faction XP.")}${def("Reports","Review completed expeditions, operational narrative, outcome causality, injuries, individual contributions, and development evidence.")}${def("Help","This reference. Return here whenever a term or screen is unclear.")}${def("Save / System","Save or export the campaign, import saves, start a new company, and enable optional playtest diagnostics.")}</section><section class="card help-section" id="help-exp"><h3>Expedition Assembly</h3><div class="small">Expedition membership and formal role assignments are <b>your decisions</b>. The game does not auto-select a party or Leader.</div><div class="divider"></div>${def("Party","Select the mercenaries you want to commit. Job cards show a recommended party range, but understrength expeditions remain possible when structurally legal.")}${def("Leader","Required. Owns consequential expedition priorities and course decisions. Leadership, Strategy, Tactics, temperament, and experience can all matter depending on context.")}${def("Scout","Optional responsibility for proactive reconnaissance and maintaining the situational picture.")}${def("Medic","Optional responsibility for medical truth, treatment, casualty assessment, and restrictions.")}${def("Quartermaster","Optional responsibility for expedition resources, sustainment, and material readiness.")}${def("Advisory information","Relevant Skills, suitability labels, coverage, and Strategist advice are decision support. They do not automatically choose for you.")}</section><section class="card help-section" id="help-defs"><h3>Core Definitions</h3>${def("Natural Aptitude","Relatively stable inherent capability: Intelligence, Awareness, Focus, Resilience, Strength, Endurance, Mobility, and Speed.")}${def("Learned Skill","A developed professional capability. Skills improve through meaningful use and evidence rather than generic character levels.")}${def("Application","A narrower reusable domain inside a broader Skill, represented as Unfamiliar, Familiar, or Specialized. Example: Survival / Animal Handling or Logistics / Vehicle Handling.")}${def("Readiness","Whether current condition affects deployment. Ready has no active readiness restriction; Limited Duty / Deployable With Limitation indicate an injury-related constraint; Not Deployable is a hard stop.")}${def("Role Suitability","A forecast of how well a mercenary fits a responsibility. It is decision support, not normally a permission gate.")}${def("Situation","An ongoing world problem or pressure that can create one or more related Employer Needs and Jobs.")}${def("World Event","An immutable causal record of something that happened in the world. Jobs and follow-up Situations retain lineage to their source events.")}${def("Job","A public contract responding to an Employer Need. Jobs can expire while the underlying Situation remains.")}${def("Objective Outcome","What objectives were achieved.")}${def("Operational Performance","How effectively the expedition operated considering casualties, time, resources, avoidable complications, and command.")}${def("Approach","The method selected by the expedition to address an Action Objective. Different approaches can rely on different Skills, Applications, risks, and actors.")}${def("Career Stage","Emerging → Developing → Established → Veteran. Professional maturity, not a character level or power tier.")}${def("Development Evidence","Meaningful Skill exercise can produce Practice, Stretch, or Consolidation evidence. Participation alone does not guarantee development.")}</section></div>`}
function systemView(){return `<div class="grid grid2"><div class="card stack"><h3>Save / Load</h3><button class="btn primary" onclick="save()">Save to browser</button><button class="btn" onclick="load()">Load browser save</button><button class="btn" onclick="exportSave()">Export save JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import save JSON</button><button class="btn bad" onclick="resetGame()">New company</button></div><div class="card"><h3>Build scope</h3><div class="small muted">Playable Base v0.2.3, based on v0.2.2: causal world Situations, world-driven Jobs, route travel and road camps, Personnel Sufficiency, dynamic Job market, rival companies, and causal consequences are active.</div><div class="divider"></div><div class="small">Mobile Strategic Map, Recent Notices, Founding Company Draft, Operational Narrative v0.3, Roster Comparison with visible injury/readiness limits, persistent Help, manual Expedition Assembly, Injury Causality, understrength-success reporting, and the approved Skill taxonomy are active.</div></div></div><div class="card" style="margin-top:12px"><div class="row"><div><h3 style="margin:0">Playtest Diagnostics</h3><div class="small muted">Optional trace and session export. Does not affect resolution.</div></div><button class="btn ${game.diagnosticsEnabled?"good":""}" onclick="setDiagnosticsEnabled(!game.diagnosticsEnabled)">${game.diagnosticsEnabled?"Enabled":"Enable"}</button></div>${game.diagnosticsEnabled?`<div class="divider"></div><div class="row"><span class="small">${diagnosticsSummary().eventCount} trace events · session ${esc(diagnosticsSummary().sessionId)}</span><button class="btn" onclick="exportDiagnostics()">Export diagnostics JSON</button></div>`:""}</div><h3>Ledger</h3><div class="card">${game.ledger.slice().reverse().slice(0,30).map(x=>`<div class="row small"><span>Day ${x.day} · ${esc(x.description)}</span><b class="money ${x.amount>=0?"pos":"neg"}">${money(x.amount)}</b></div>`).join("")}</div>`}

function confirmFire(id){const m=merc(id);if(!m)return;document.getElementById("modalTitle").textContent=`Dismiss ${m.name}?`;document.getElementById("modalBody").innerHTML=`<div class="notice warn"><b>This permanently removes ${esc(m.name)} from the active roster.</b><br><span class="small">Future payroll falls by ${money(m.payroll)}. Career History is preserved in the former-mercenary archive. No recruit appears automatically.</span></div><div class="row" style="margin-top:12px"><button class="btn" onclick="showMerc('${m.id}')">Cancel</button><button class="btn bad" onclick="fireMercenary('${m.id}')">Confirm Firing</button></div>`}
function causalityHtml(r){const c=r.outcomeCausality;if(!c)return "";const success=r.outcome==="success",title=success?"Why this mission succeeded":r.outcome==="withdrawal"?"Why this ended in withdrawal":"Why this mission failed";return `<h4>${title}</h4><div class="notice ${r.outcome==="failure"?"bad":r.outcome==="withdrawal"?"warn":"good"}"><b>${esc(c.primaryCause)}</b><div class="small" style="margin-top:5px">${esc(c.summary)}</div>${c.completionRequirement!=null?`<div class="small" style="margin-top:6px"><b>Completion:</b> ${fmt3(c.accumulatedProgress)} progress vs ${fmt3(c.completionRequirement)} required</div>`:""}${success&&c.decisiveContributions?.length?`<div class="small" style="margin-top:6px"><b>Decisive contributions</b>${c.decisiveContributions.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${success&&c.unresolvedSetbacks?.length?`<div class="small" style="margin-top:6px"><b>Unresolved pressure</b>${c.unresolvedSetbacks.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${!success?`<div class="divider"></div><div class="small"><b>Proximal trigger:</b> ${esc(c.proximalTrigger||"Not recorded")}</div>`:""}${!success&&c.contributors?.length?`<div class="small" style="margin-top:6px"><b>Contributing factors</b>${c.contributors.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}${c.levers?.length?`<div class="small" style="margin-top:6px"><b>What could have changed the outcome?</b>${c.levers.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}</div>`}
function understrengthSuccessHtml(r){const u=r.understrengthSuccess;if(!u)return "";return `<div class="notice warn" style="margin-top:8px"><b>${esc(u.label)} — ${esc(u.band)}</b><div class="small">The expedition completed the contract with ${u.actual} mercenaries${u.recommended?` against a recommended party of ${esc(String(u.recommended))}`:""}. ${esc(u.summary||"")}</div><div class="tiny muted">Peak operational commitments ${u.maxOperationalCommitments??0} · sustainment burden ${fmt3(u.sustainmentBurden||0)}</div></div>`}
function injuryCausalityHtml(r){if(!r.injuries?.length)return `<div class="small muted">None</div>`;return r.injuries.map(x=>{const primary=x.primaryActorName&&x.primaryActorName!==x.actorName?` while supporting ${esc(x.primaryActorName)}'s ${esc(mechanismPhrase(x.approach||"operation"))}`:` during ${esc(mechanismPhrase(x.approach||"the operation"))}`;const ctx=x.operation&&x.primitive?`${esc(x.operation)} / ${esc(x.primitive)}`:"operational activity";return `<div class="notice warn" style="margin:6px 0"><b>${esc(x.actorName)} — ${esc(x.severity)} injury</b><div class="small">Wounded${primary}. Cause: ${ctx}; casualty exposure ${esc(x.casualtyExposure||"unknown")}${x.result?` with a ${esc(String(x.result).toUpperCase())} resolution`:""}.</div>${x.context?`<div class="tiny muted">Context: ${esc(x.context)}</div>`:""}</div>`}).join("")}
function eventNarrativeHtml(e){const n=e.narrative;if(!n)return e.context?`<div class="small">${esc(e.context)}</div>`:"";return `<div class="small" style="margin:6px 0"><div>${esc(n.situation)}</div><div>${esc(n.action)}</div>${n.complication?`<div>${esc(n.complication)}</div>`:""}<div><b>${esc(n.result)}</b> ${esc(n.consequence)}</div></div>`}


document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importSave(e.target.files[0])});
game=normalizeGameState(game);
refreshRelationshipDerivations();
bootstrap();
telemetryInit();
window.__MCS_TEST__={
  snapshot:()=>deep(game),
  diagnostics:()=>diagnosticsExportObject(),
  reset:()=>{game=normalizeGameState(freshGameState());bootstrap();telemetryInit();currentTab="dashboard";selectedJobId=null;selectedParty=[];selectedLeader="";selectedRoles={scout:"",medic:"",quartermaster:""};render();return deep(game)},
  advance:()=>{advance();return deep(game)},
  rivals:()=>deep(game.rivalCompanies),worldHistory:()=>deep(game.worldState.history),worldCausality:()=>({situations:deep(game.worldState.situations),employerNeeds:deep(game.worldState.employerNeeds),offers:deep(game.offers)}),build:BUILD_INFO
};
render();


</script>
</body>
</html>
